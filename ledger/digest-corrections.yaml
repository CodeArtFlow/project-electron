corrections:
- date: '2026-09-21'
  digest: '2026-09-20'
  text: This digest reported 'Nothing new' although the ledger held seven claims extracted that day. The
    digest builder counted its own earlier run as history, so a second run on the same day saw every claim
    as already reported and overwrote the digest. The claims appeared on the state-of-the-art pages that
    day but not in this digest. The builder is fixed, and the claims are listed in full in the 2026-09-21
    digest.
