    reason: 'CFL-0012: conditions omitted the sample state, so this post-deposition measurement shared
      subject with CLM-PHOT-0007''s bare-substrate measurement of the same roughness_type and opened a
      false conflict. The source (SRC-00018) reports both as one before/after sequence (''The bare silicon
      substrate exhibited Sa=0.23 nm... After deposition, the roughness increased to Sa=1.7 nm''); sample
      restored to distinguish them. Digest 2026-09-23 cited the unscoped conditions and the resulting
      conflict, but never reached readers - the gate blocked that day''s deploy on this conflict, so the
      site stayed on the prior build.'
  quantity:
