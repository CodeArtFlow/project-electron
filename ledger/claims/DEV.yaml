  grade: B
  credibility: unknown
  evidence_type: measured
  status: active
  as_of: '2026-09-16'
  created: '2026-09-20'
- id: CLM-DEV-0002
  topic: DEV
  statement: The custom high vacuum deposition chamber reached a background pressure of approximately
    3 × 10 -7 torr during top Al cathode deposition for QLEDs.
  sources:
  - SRC-00006
  grade: B
  credibility: unknown
  evidence_type: simulated
  status: retracted
  as_of: '2026-09-17'
  created: '2026-09-21'
  extraction:
    method: automated-extractive
    model: gemini-3.6-flash
    prompt_version: reader-v2
    verified_quotes: 2
  conditions:
    process: high vacuum deposition
  quantity:
    quantity: pressure
    bound: exact
    approximate: true
    as_published:
      value: 3.0e-07
      unit: torr
    si_base:
      value: 3.999671052631579e-05
      unit: Pa
    display:
      value: 0.0003
      unit: mTorr
    conditions:
      process: high vacuum deposition
  corrections:
  - date: '2026-09-22'
    public: false
    fields:
    - status
    reason: 'Retracted (D7, TODO.md). This is the fabrication environment SRC-00006''s device was
      made under, not a finding the paper stands behind - the doctrine''s claim anatomy already has
      a place for that (`conditions`, carried on the claim it conditions). No result claim was
      extracted from SRC-00006 for this to be a condition OF, so it does not belong in the ledger as
      a claim of its own. Nothing published cites it. See SRC-00006 for the same fact in context.'
