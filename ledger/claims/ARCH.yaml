    bound: upper_bound
    approximate: true
    as_published:
      value: 5.0
      unit: x
    si_base:
      value: 5.0
      unit: dimensionless
    display:
      value: 5.0
      unit: dimensionless
    conditions:
      process: TSMC 16nm FinFET
      comparison: PFAL vs static CMOS
      operating_point: most favorable operating point
      vclk: 1 V
      fclk: 100 MHz
  conditions:
    process: TSMC 16nm FinFET
    comparison: PFAL vs static CMOS
    operating_point: most favorable operating point
    vclk: 1 V
    fclk: 100 MHz
  corrections:
  - date: '2026-09-21'
    public: true
    fields:
    - statement
    - quantity.bound
    - quantity.approximate
    - conditions
    reason: Recorded as 'single-gate PFAL cells ... approximately 5x', an exact-looking value with a scope
      the source does not state and an operating point ('maximum over the sweep') that was my gloss. The
      conclusions say 'up to approximately 5x at the most favorable operating points (V_CLK = 1 V and
      f_CLK = 100 MHz)', across the functional region. Now an approximate upper bound with the stated
      operating point.
