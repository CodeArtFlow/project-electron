claims:
- id: CLM-ARCH-0001
  topic: ARCH
  statement: Low-threshold PFAL Buffer/NOT cell reaches a minimum energy-delay product
    of 1.23e-26 J*s in simulation.
  sources:
  - SRC-00001
  grade: B
  credibility: unknown
  evidence_type: simulated
  status: active
  as_of: '2026-09-17'
  created: '2026-09-20'
  quantity:
    quantity: energy_delay_product
    as_published:
      value: 1.23e-26
      unit: J*s
    si_base:
      value: 1.23e-26
      unit: J*s
    display:
      value: 1.23e-26
      unit: J*s
    conditions: &id001
      process: TSMC 16nm FinFET
      cell: low-threshold Buffer/NOT
      vclk: 0.6 V
      fclk: 7.94 GHz
  conditions: *id001
