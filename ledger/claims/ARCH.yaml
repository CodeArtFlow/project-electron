    architecture: MiX-INT4g16
    array_size: 1024-MAC
    process: 28nm
    frequency: 500 MHz
  quantity:
    quantity: power
    bound: exact
    approximate: false
    as_published:
      value: 40.4
      unit: mW
    si_base:
      value: 0.0404
      unit: W
    display:
      value: 0.0404
      unit: W
    conditions:
      component: 1024-MAC Systolic Array
      architecture: MiX-INT4g16
      array_size: 1024-MAC
      process: 28nm
      frequency: 500 MHz
  corrections:
  - date: '2026-09-21'
    public: false
    fields:
    - conditions
    reason: 'The claim''s statement names the array size and architecture variant that separate it from
      the paper''s other power figures (Table V is the 1024-MAC array of the MiX-INT4g16 accelerator;
      Table VI compares iso-throughput 512-MAC arrays), but the structured conditions did not, so the
      detector saw comparable numbers. Conditions restated from the statement. Before: {''component'':
      ''1024-MAC Systolic Array''}.'
  - date: '2026-09-21'
    public: false
    fields:
    - evidence_type
    - statement
    reason: '`measured` was wrong: the table caption in the paper reads "AREA AND POWER ARE SYNTHESIS
      RESULTS" (Synopsys Design Compiler on RTL, TSMC28HPC). That is a synthesis-tool estimate, not a
      silicon measurement, so the evidence type is `simulated`. Found by reading the excerpt after the
      first paper-grounded TypeSafe run, which had also answered `measured` and so did not catch it (docs/typesafe-preregistration.md).
      The statement said "28nm CMOS". The excerpts sent to TypeSafe contain no "CMOS": the word was supplied
      by the reading model, and the paper says "TSMC28HPC". TypeSafe''s term question (p=0.18) caught
      it, and reading the excerpt confirmed it. Removed, matching CLM-ARCH-0008/0009.'
