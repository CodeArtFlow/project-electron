- id: CLM-ARCH-0007
  topic: ARCH
  statement: The 1024-MAC Systolic Array component in the MiX-INT4g16 accelerator consumes 40.4 mW of
    power in 28nm at 500 MHz.
  sources:
  - SRC-00005
