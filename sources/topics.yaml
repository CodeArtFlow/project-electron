# ---------------------------------------------------------------------------
# ADJACENT — harvested, stamped `relevance: adjacent`
# ---------------------------------------------------------------------------
# Neighbouring sub-fields of the same domain. These routinely carry results that are literally
# semiconductor fabrication - a metasurface patterned wafer-scale, a modulator in thin-film
# lithium niobate, a spin Hall oscillator. Higher volume and lower average relevance than core,
# so the marking matters: it tells the reading stage to expect more misses here.
adjacent:
  - {id: T10245, name: "Metamaterials and Metasurfaces Applications", topics: [PHOT, PROC], why: "Wafer-scale patterning and on-chip optics."}
  - {id: T11050, name: "Photorefractive and Nonlinear Optics", topics: [PHOT], why: "Integrated photonics - thin-film lithium niobate modulators and similar."}
  - {id: T10299, name: "Photonic and Optical Devices", topics: [PHOT], why: "Broad, but silicon photonics lives here. Moved from exclude."}
  - {id: T10666, name: "Photonic Crystals and Applications", topics: [PHOT], why: "On-chip photonic structures. Moved from exclude."}
  - {id: T10247, name: "Perovskite Materials and Applications", topics: [MAT, DEV], why: "Optoelectronic devices and thin-film deposition. Moved from exclude."}
  - {id: T10045, name: "Organic Electronics and Photovoltaics", topics: [MAT, DEV], why: "Thin-film device fabrication. Moved from exclude."}
  - {id: T10049, name: "Magnetic properties of thin films", topics: [MEM, MAT], why: "Spintronics and MRAM stacks."}
  - {id: T10657, name: "Topological Materials and Phenomena", topics: [MAT], why: "Candidate channel materials for future devices."}
  - {id: T11449, name: "Mechanical and Optical Resonators", topics: [DEV], why: "MEMS/NEMS resonators, fabricated by the same processes."}
  - {id: T10338, name: "Advanced Sensor and Energy Harvesting Materials", topics: [DEV, MAT], why: "Sensors are silicon devices; energy harvesting is the weaker half of this topic."}
  - {id: T11523, name: "Nanomaterials and Printing Technologies", topics: [PROC, MAT], why: "Printed and flexible electronics fabrication."}
  - {id: T12495, name: "Electrostatic Discharge in Electronics", topics: [DEV, PROC], why: "Device reliability. Moved from exclude."}
  - {id: T11471, name: "Block Copolymer Self-Assembly", topics: [LITHO], why: "Directed self-assembly patterning. Moved from exclude."}
  - {id: T12111, name: "Industrial Vision Systems and Defect Detection", topics: [PROC], why: "Wafer inspection and defect metrology. Moved from exclude."}

# ---------------------------------------------------------------------------
# Considered and excluded — recorded so the decision is not re-litigated
# ---------------------------------------------------------------------------
# Each of these surfaced in a topic search for a term in our scope. Excluding them IS the
# strictness. Revisit only with a reason.
exclude:
  # Different domain entirely. Not "less relevant" - not about our subject at all.
  - {id: T10448, name: "Memory and Neural Mechanisms", why: "Neuroscience. The clearest example of why keyword filtering failed."}
  - {id: T10918, name: "Memory Processes and Influences", why: "Psychology."}
  - {id: T10488, name: "Nanocomposite Films for Food Packaging", why: "Food science."}
  - {id: T10333, name: "Meat and Animal Product Quality", why: "Surfaced by the word 'packaging'. Nothing further need be said."}
  - {id: T10078, name: "Advanced Photocatalysis Techniques", why: "Catalysis chemistry; no device or fabrication path."}
  - {id: T11255, name: "Microfluidic and Bio-sensing Technologies", why: "Biomedical. Shares some fabrication, but the research question is not ours."}
  - {id: T10781, name: "Plasma Diagnostics and Applications", why: "830k works, overwhelmingly plasma physics rather than process."}
  - {id: T10054, name: "Parallel Computing and Optimization Techniques", why: "Software parallelism, not hardware."}
  - {id: T10074, name: "Carbon Nanotubes in Composites", why: "Structural composites, not electronics."}
  - {id: T13104, name: "Chemical and Physical Properties of Materials", why: "Generic materials science with no device focus."}
  - {id: T12510, name: "Magneto-Optical Properties and Applications", why: "212k works of magneto-optics; the device-relevant part is covered by T10049."}
  - {id: T10846, name: "Photonic Crystal and Fiber Optics", why: "Fibre optics - off-wafer."}
