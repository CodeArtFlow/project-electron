  - {id: T10558, name: "Advancements in Semiconductor Devices and Circuit Design", topics: [DEV, ARCH]}
  - {id: T10623, name: "Thin-Film Transistor Technologies", topics: [DEV]}
  - {id: T10099, name: "GaN-based semiconductor devices and materials", topics: [DEV, MAT]}
  - {id: T10361, name: "Silicon Carbide Semiconductor Technologies", topics: [DEV, MAT]}
  - {id: T12529, name: "Ga2O3 and related materials", topics: [MAT, DEV]}
  - {id: T10590, name: "Chalcogenide Semiconductor Thin Films", topics: [MAT]}
  - {id: T12808, name: "Ferroelectric and Negative Capacitance Devices", topics: [DEV, MEM]}

  - {id: T10275, name: "2D Materials and Applications", topics: [MAT, DEV]}
