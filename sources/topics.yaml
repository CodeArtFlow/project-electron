# Project Electron — Topic allowlist for broad venues
#
# Replaces keyword matching, which was not fit for purpose. OpenAlex's own topic search shows why:
#   "memory"    -> "Memory and Neural Mechanisms" (neuroscience)
#   "packaging" -> "Nanocomposite Films for Food Packaging", "Meat and Animal Product Quality"
# A keyword filter cannot tell those apart from DRAM and flip-chip packaging. Structured topic
# IDs can, because OpenAlex has already classified the work.
#
# WHERE THIS APPLIES: only to venues with `scope: broad` in registry.yaml. Venues marked
# `scope: specialist` are semiconductor-dedicated and are swept without any topic filter, so a
# strict allowlist here cannot cost us coverage in those venues. That is what makes strictness
# safe: photonics comes from the photonics journals, memory from the memory-heavy venues.
#
# STRICTNESS: precision over recall, deliberately (user, 2026-09-20: "strictly want only the
# relevant articles"). A broad journal paper whose primary topic is not on this list is not
# harvested. The cost is recall on interdisciplinary work; the benefit is a corpus that is
# actually about semiconductors.
#
# MATCHING: `primary_topic.id`, not `topics.id`. A work's primary topic is its dominant subject;
# matching any of its topics would readmit the noise this file exists to remove.
#
# Adding an entry: confirm the topic id and name against https://api.openalex.org/topics/<id>
# before use. A topic id invented from memory is the same failure as an invented journal.

# TWO INSTRUCTIONS THAT PULLED OPPOSITE WAYS, AND HOW THEY RECONCILE (2026-09-20)
#   "be extremely specific and picky ... strictly want only the relevant articles"
#   "those shouldn't be dropped, those are still semiconductor manufacturing;
#    adjacent fields could still be useful"
#
# The first version of this file applied the first instruction to BOTH kinds of exclusion and
# was wrong for it. Measuring it against 49 already-harvested broad-venue candidates proved it:
# ZERO passed. It was rejecting wafer-scale metasurface optics, lithium-niobate modulators and
# spin Hall oscillators - all of which are semiconductor fabrication - alongside food packaging
# and neuroscience.
#
# The resolution: be strict about DOMAIN, not about SUB-FIELD.
#   core      same sub-field. Unambiguously our stack.
#   adjacent  same domain, neighbouring sub-field. Devices, fabrication or materials that end
#             up on a wafer. Harvested, but stamped `relevance: adjacent` on the candidate so
#             the reading stage applies a higher bar and the digest can say which is which.
#   exclude   different domain entirely. Food science, neuroscience, psychology, medicine.
#
# Adjacency is recorded on the candidate rather than decided silently by a filter, so a reader
# can see what came in as a near-miss instead of trusting that the filter got it right.

schema_version: 1
updated: 2026-09-20
match_field: primary_topic.id
applies_to: venues with scope 'broad'

# ---------------------------------------------------------------------------
# CORE — verified against the OpenAlex topics API on 2026-09-20
# ---------------------------------------------------------------------------
allow:
