# ---------------------------------------------------------------------------
# Removed entries — kept so the deletion is auditable
# ---------------------------------------------------------------------------
removed:
  - id: ieee_ojeds
    name: IEEE Open Journal of the Electron Devices Society
    removed_on: 2026-09-20
    reason: >
      DOES NOT EXIST. No Crossref match under any query variant. The name was fabricated in the
      registry's first draft by blending IEEE's real Open Journal series with the real IEEE
      Journal of the Electron Devices Society (JEDS, ISSN 2168-6734, which is listed above and
      verified). The Open Journal series is genuine — OJ-SSCS, OJ-Nano and OJ-CAS are all
      verified and now listed — but it has no Electron Devices title.
    lesson: >
      This is the exact failure the verification gate exists to catch: a plausible name,
      assembled from real components, that no authority recognises. It survived one drafting
      pass and died on first contact with Crossref.

# ---------------------------------------------------------------------------
# Known-paywalled — recorded so we stop re-discovering them. DO NOT HARVEST.
# ---------------------------------------------------------------------------
excluded_paywalled:
  - {id: techinsights,  name: TechInsights,            reason: subscription,     note: Die-shot/teardown authority. Reaches us only via others' open citation.}
  - {id: semianalysis,  name: SemiAnalysis,            reason: partial_paywall,  note: Free tier only.}
  - {id: semi_standards, name: SEMI Standards,         reason: paid}
  - {id: ieee_xplore,   name: IEEE Xplore (general),   reason: subscription,     note: Route individual papers via author copies.}
  - {id: sciencedirect, name: ScienceDirect/Elsevier,  reason: subscription}
