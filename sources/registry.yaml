  - {id: research_square, name: Research Square, url: "https://www.researchsquare.com/", oa_status: preprint, grade_default: B, topics: [MAT, DEV], verified: true, probe: "200"}
  - id: techrxiv
    name: TechRxiv (IEEE)
    url: "https://www.techrxiv.org/"
    oa_status: preprint
    grade_default: B
    topics: [DEV, ARCH, EDA]
    verified: false
    probe: "403"
    blocker: >
      Bot protection returns 403 to automated clients, including the documented API paths.
      The content is open; our access to it is not. Needs a different route (RSS, the in-app
      browser, or an IEEE-provided endpoint) before harvest. Not evaded.
  - {id: chemrxiv,        name: ChemRxiv,        url: "https://chemrxiv.org/",         oa_status: preprint, grade_default: B, topics: [MAT],      verified: false, probe: "403",
     blocker: "Bot protection returns 403, including on /engage/chemrxiv/public-api/v1/items. Same situation as TechRxiv."}

# ---------------------------------------------------------------------------
# Conferences — proceedings usually paywalled; harvest author copies and open slides
# ---------------------------------------------------------------------------
# Every `hybrid` conference is `review`, for the same reason hybrid journals are: the venue is
# real and reachable, but whether any given paper is open is a per-item question. Hot Chips is
# `true` because its slides are published openly as a matter of course, not per-paper.
# (Caught by validate_registry.py: these were initially marked `true`, contradicting the
# registry's own three-state rule.)
conferences:
  - {id: iedm,     name: IEEE IEDM,             url: "https://www.ieee-iedm.org/",          oa_status: hybrid,    grade_default: A, topics: [DEV, PROC, MEM], verified: review, probe: "200", notes: Proceedings paywalled. Route via arXiv author copies and open press materials.}
  - {id: vlsi,     name: VLSI Symposium,        url: "https://www.vlsisymposium.org/",      oa_status: hybrid,    grade_default: A, topics: [DEV, PROC],      verified: review, probe: "200", notes: As IEDM.}
  - {id: isscc,    name: ISSCC,                 url: "https://www.isscc.org/",              oa_status: hybrid,    grade_default: A, topics: [ARCH, MEM],      verified: review, probe: "200", notes: As IEDM.}
  - {id: hotchips, name: Hot Chips,             url: "https://hotchips.org/",               oa_status: open_spec, grade_default: C, topics: [ARCH, PKG],      verified: true, probe: "200", notes: Slides often public. Vendor-presented — grade C, not A.}
  - {id: isca,     name: ISCA,                  url: "https://iscaconf.org/",               oa_status: hybrid,    grade_default: A, topics: [ARCH],           verified: review, probe: "200", notes: Many author copies open.}
  - {id: micro,    name: MICRO,                 url: "https://microarch.org/",              oa_status: hybrid,    grade_default: A, topics: [ARCH],           verified: review, probe: "200"}
  - {id: asplos,   name: ASPLOS,                url: "https://www.asplos-conference.org/",  oa_status: hybrid,    grade_default: A, topics: [ARCH],           verified: review, probe: "200"}
  - {id: date,     name: DATE,                  url: "https://www.date-conference.com/",    oa_status: hybrid,    grade_default: A, topics: [EDA],            verified: review, probe: "200"}
  - {id: dac,      name: DAC,                   url: "https://www.dac.com/",                oa_status: hybrid,    grade_default: A, topics: [EDA],            verified: review, probe: "200"}
  - {id: ecs_meet, name: ECS Meeting Abstracts, url: "https://www.electrochem.org/meetings", oa_status: hybrid,   grade_default: B, topics: [MAT, PROC],      verified: review, probe: "200"}

