# Project Electron — Open-Access Source Registry
#
# The comprehensive list of relevant open-access venues we harvest.
#
# VERIFIED 2026-09-20 against live authorities. Evidence: pipeline/verification_report.json,
# pipeline/discovery_report.json, pipeline/url_probe_report.json.
# Reproduce with:  python pipeline/verify_registry.py --section all
#
# verified:
#   true    - exists, active, and OA status CONFIRMED by an authority (DOAJ for journals,
#             successful endpoint probe for APIs). Harvestable.
#   review  - exists and active, but OA status NOT confirmed. Harvestable ONLY with a
#             per-article OA check (OpenAlex best_oa_location / author copy). Every `hybrid` venue is
#             permanently `review` by definition — OA is an article-level property there.
#   false   - existence or reachability could not be established. DO NOT HARVEST.
#
# Why three states and not two: "exists and is active, but I cannot confirm open access" is a
# real and common outcome. Forcing it into true would assert OA we have not established;
# forcing it into false would discard venues that are genuinely reachable. Both are lies of a
# different kind, so the state that describes reality gets its own name.
#
# ISSN is the identifier of record. Title matching is a fallback: Crossref journal search is
# punctuation-sensitive and returns nothing for '&', and generic titles ("Nature", "Science")
# do not surface at all. Where a registry entry carries an issn, verification is deterministic.
#
# oa_status:  full        - everything is open access
#             hybrid      - some articles OA; per-article check required
#             preprint    - author manuscripts, not version of record
#             open_spec   - freely downloadable standard/roadmap
#             public_corp - vendor's own public technical material
#             open_news   - freely readable journalism/analysis
#
# grade_default: the evidence grade a typical item starts at, per CLAUDE.md. Always overridable
#             downward by what the specific item actually contains.
# topics:     topic codes per CLAUDE.md (MAT DEV LITHO PROC PKG MEM ARCH PHOT EDA ECON).
#             `ALL` is a registry-only wildcard meaning the venue spans every topic code; it is
#             not a topic code itself and never appears on a claim ID.
# recent:     Crossref-indexed works in the 400 days before the verification date. Evidence of
#             activity, not of quality.

schema_version: 3
updated: 2026-09-20
verified_on: 2026-09-20

# ---------------------------------------------------------------------------
# Aggregators and discovery APIs — the harvest backbone
# ---------------------------------------------------------------------------
aggregators:
  - id: openalex
    name: OpenAlex
    endpoint: https://api.openalex.org
    oa_status: full
    access: rest_api
    auth: none
    verified: true
    probe: "GET /works?per-page=1 -> 200"
    notes: >
      Primary discovery index, and the backbone for author records and academic lineage.
      ALSO the per-article OA authority: every work carries `open_access` (is_oa, oa_status)
      and `best_oa_location` (host, version, license, pdf_url). This is what a `review` venue's
      per-article check uses, and what must return `closed` before an `access-blocked` gap is
      recorded. OpenAlex is Unpaywall's successor, from the same team and the same data.

  - id: arxiv_api
    name: arXiv API
    endpoint: http://export.arxiv.org/api/query
    oa_status: preprint
    access: rest_api
    auth: none
    categories: [cond-mat.mtrl-sci, cond-mat.mes-hall, physics.app-ph, physics.optics, cs.AR, cs.ET, eess.SP]
    grade_default: B
    verified: true
    probe: "GET cat:cond-mat.mtrl-sci -> 200"
    notes: Highest-volume relevant preprint feed. Category list is the harvest scope.

  - id: crossref
    name: Crossref
    endpoint: https://api.crossref.org
    oa_status: full
    access: rest_api
    auth: none
    verified: true
    probe: "GET /works?rows=1 -> 200"
    notes: >
      DOI resolution, canonical metadata, ISSN authority, retraction notices. We use the public
      pool: the polite pool wants a contact email, and the operator's address is not ours to
      hand to third-party services.

  - id: doaj
    name: Directory of Open Access Journals
    endpoint: https://doaj.org/api
    oa_status: full
    access: rest_api
    auth: none
    verified: true
    probe: "GET /search/journals/issn:2041-1723 -> 200"
    notes: >
      THE authority for journal OA status in this registry. Listing confirms full OA.
      Absence does NOT prove paywall — it downgrades a `full` claim to `review`, nothing more.

  - id: osti
    name: OSTI (US DOE research output)
    endpoint: https://www.osti.gov/api/v1
    oa_status: full
    access: rest_api
    grade_default: A
    verified: true
    probe: "GET /records?rows=1 -> 200"
    notes: National lab output — Sandia, LBNL, Argonne, Oak Ridge.

  - id: retraction_watch
    name: Retraction Watch Database (via Crossref Labs)
    endpoint: https://api.labs.crossref.org/data/retractionwatch
    oa_status: full
    access: bulk_dataset
    verified: review
    probe: "streamed first 2 KiB -> 503 (2026-09-20, later attempt)"
    notes: >
      Integrity flags for author credibility tiers. Checked before any `established` tier.
      NOT a query API: it ignores query parameters and serves the entire CSV (~66 MB measured
      2026-09-20). Download periodically and query locally; never fetch per-author. An earlier
      registry entry described it as a rest_api probed with `?rows=1`, which was wrong - that
      probe was downloading the whole dataset and passed only by finishing inside the timeout.
    state: >
      Observed HTTP 200 serving 66,841,610 bytes on 2026-09-20, then HTTP 503 on a later probe
      the same day. Existence and content are evidenced; current availability is not. Marked
      `review` rather than `true` because we cannot presently obtain a clean fetch, and not
      `false` because we directly measured it serving the dataset. The 503 is most likely
      self-inflicted - we pulled the full 66 MB twice in quick succession before the streamed
      probe existed. Do not re-probe aggressively; retry on a later day.

  - id: semantic_scholar
    name: Semantic Scholar Academic Graph
    endpoint: https://api.semanticscholar.org/graph/v1
    oa_status: full
    access: rest_api
    auth: api_key_required_in_practice
    verified: review
    probe: "GET /paper/search -> 429 (rate-limited without key)"
    blocker: >
      Unauthenticated requests are rate-limited to the point of being unusable. A free API key
      is available on request from Semantic Scholar. Needed for citation-graph and
      author-influence data feeding credibility tiers; OpenAlex covers the same ground and is
      usable now, so this is an enhancement rather than a blocker.

  - id: unpaywall
    name: Unpaywall
    endpoint: https://api.unpaywall.org/v2
    oa_status: full
    access: rest_api
    auth: email_required
    verified: false
    status: superseded_by_openalex
    blocker: >
      Not needed, and not used. Unpaywall's own API documentation states that OpenAlex is its
      successor - same team, same data - and that every OpenAlex result carries `open_access`
      and `best_oa_location`. The /v2/search endpoint was retired on 2026-09-18 and now returns
      410 Gone, with that page pointing to OpenAlex. The /v2/:doi endpoint still requires a
      contact email in every request; since OpenAlex covers the same need with no email, we do
      not use it and no email decision is required.
    verified_finding: >
      Checked 2026-09-20 against api.openalex.org: a DOI lookup returns is_oa, oa_status and
      best_oa_location (host, version, license, pdf_url), and correctly reports `closed` for
      recent subscription-only IEEE TED articles rather than inventing a copy.
    correction: >
      An earlier draft of this registry recorded Unpaywall as a material blocker requiring an
      email decision. That was asserted from assumption without checking the API, which rule 1
      forbids. Reading the documentation dissolved the blocker entirely.

