provenance:
  labelled_by: Claude (the pipeline's author), from the papers' text
  independent_review: PENDING - not yet reviewed by anyone else
  warning: These labels were written by the same agent that made the extractions being judged. Treat them
    as a SEED, not a validated benchmark, until a second person has checked them.
semantics:
  labels_are_relative_to: the evidence the audit is shown (the source RECORD), not the original paper.
    The audit cannot see the paper; see `blind_spot`.
  noul: atomic and gap_visible are 'yes is good' (true expected); overstates is 'yes is bad' (false expected).
    A noul value is P(yes).
