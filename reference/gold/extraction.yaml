- id: gold-ex-arch0004
  stage: extraction
  audit_id: claim:CLM-ARCH-0004
  fingerprint: 14fd9e9f897f01d8ebdc1b82d700f14cbdb9e2e5d4ed50b9f99a15d761b5502a
  labels:
    support: supports
    conditions: supported
    atomic: true
    evidence_type: simulated
    numbers: distorted
  basis: 'Relative to the record the conditions are supported: its method_summary says the gates were
    characterised by energy-delay-product optimization. The source says ''up to'', so the number is an
    upper bound. The record stored an exact value with no bound, which is a distortion of the source.'
  blind_spot: 'The recorded condition ''EDP-optimal'' is WRONG against the paper: Table 2 reports the
    minimum-ENERGY points of the TRAPEZOIDAL sweep. The record inherited the error from the abstract,
    so an audit that only sees the record cannot catch it. Only reading the paper does. This is a documented
    ceiling on what this audit can find.'
  state:
    claim:
      id: CLM-ARCH-0004
      topic: ARCH
      statement: Optimized single-gate PFAL cells achieve up to 3.83x lower energy than equivalent static
        CMOS gates in simulation.
      sources:
      - SRC-00002
      grade: B
      credibility: unknown
      evidence_type: simulated
      status: active
      as_of: '2026-09-17'
      created: '2026-09-20'
      quantity:
        quantity: energy_advantage_ratio
        as_published:
          value: 3.83
          unit: dimensionless
        si_base:
          value: 3.83
          unit: dimensionless
        display:
          value: 3.83
          unit: dimensionless
        conditions:
          process: TSMC 16nm FinFET
          comparison: single-gate PFAL vs static CMOS
          operating_point: EDP-optimal over power-clock amplitude, frequency and waveform
      conditions:
        process: TSMC 16nm FinFET
        comparison: single-gate PFAL vs static CMOS
        operating_point: EDP-optimal over power-clock amplitude, frequency and waveform
      corrected: '2026-09-20: conditions corrected per CFL-0001. The regime "reduced frequency, elevated
        supply" was copied from SRC-00001 during batch extraction and is not stated in SRC-00002.'
    sources:
      SRC-00002:
        id: SRC-00002
        title: Evaluation of Power-Clock Waveforms for Positive Feedback Adiabatic Logic in 16nm FinFET
        url: https://arxiv.org/abs/2609.19998v1
        access: full_text_figures
        reported: Optimized single-gate PFAL cells achieve up to 3.83x lower energy than equivalent static
          CMOS gates. Sinusoidal excitation improves energy by up to 1.32x compared with trapezoidal excitation
          and extends the valid operating range. A 4-bit Brent-Kung carry look-ahead adder reaches a gain
          of up to 5.3x compared with the static CMOS energy estimate for the triangular power-clock.
          The power-clock sweep shows the minimum-energy waveform approaches a triangular shape rather
          than a conventional trapezoid.
        method_summary: PFAL gate library designed, verified and characterised in the TSMC 16 nm FinFET
          process by energy-delay-product optimization over power-clock amplitude, frequency and waveform
          shape. Simulation only. The adder comparison uses a static CMOS energy ESTIMATE rather than
          a full static CMOS simulation.
        limitations: Simulation only. Same three authors and same institution as SRC-00001, so the two
          are not independent sources. The 5.3x adder figure is against an estimated rather than simulated
          static CMOS baseline.
        evidence_type: simulated
        grade: B
