      SRC-00001:
        id: SRC-00001
        title: Evaluating Positive Feedback Adiabatic Logic in 16nm FinFET with a Realistic Power-Clock
        url: https://arxiv.org/abs/2609.19999v1
        access: full_text_figures
        reported: 'Minimum energy-delay product of 1.23e-26 J*s for the low-threshold PFAL Buffer/NOT
          cell at V_CLK = 0.6 V and f_CLK = 7.94 GHz. PFAL preserves an energy benefit over static CMOS
          of up to roughly 5x at reduced frequencies and elevated supply voltages. With a parallel-coupled
          quadrature VCO as a non-ideal four-phase power-clock generator, the Buffer/NOT energy stays
          within 2% of the ideal sinusoidal case at 3 GHz. Three sources of non-adiabatic loss are identified:
          threshold-voltage-related loss in the PMOS/NMOS latch, a previously unreported redundant charging
          of the output node, and loss related to PFAL logic tree complexity.'
        method_summary: Cadence transient circuit simulation of a PFAL standard-cell library in the TSMC
          16 nm FinFET process. No fabricated silicon; all figures are simulated. Comparison baseline
          is static CMOS simulated in the same process.
        limitations: Simulation only - no measured silicon. Single process (TSMC 16nm FinFET). Static
          CMOS baseline is itself simulated rather than measured. The 'roughly 5x' figure is stated approximately
          in the abstract without a tolerance.
        evidence_type: simulated
        grade: B
