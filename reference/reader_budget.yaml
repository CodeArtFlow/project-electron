# Project Electron - reader budget
#
# What the automated reader (pipeline/read_paper.py) may spend, and the prices it is budgeted at.
# This is a COMMITTED FILE, not a runtime switch, for the same reason reference/semantic_policy.yaml
# is: AGENTS.md says a gate CI can route around is not a gate. There is no workflow input or
# environment variable that raises the cap. The CLI can only LOWER it (--budget-usd), never raise it.
# Changing the cap is a commit, visible in history and review.
#
# How the cap is enforced (pipeline/budget.py):
#   * Spend is recorded from the token counts the API reports, at the prices below, in
#     corpus/candidates/_reader_spend.json, and committed with the run so it survives between runs.
#   * Pacing: a day may spend at most an even share of what is left of the month, so a backfill or a
#     mistake cannot burn the month on its first day and leave nothing for the other thirty.
#   * Before EVERY call the worst case (the whole input, plus the full max_output_tokens, which for
#     Gemini covers thinking and answer combined) must fit in what is left today. If it does not,
#     the run stops with stop_reason "budget". Nothing is read on credit.
#   * A call whose outcome is unknown (a timeout: the request may have been processed and billed
#     without us seeing the usage) is charged at its worst case, not at zero.
#   * If this file, or the spend ledger, is unreadable the reader refuses to run. It fails closed.
#
# THIS IS A SECOND LINE OF DEFENCE. Our accounting is only as good as our copy of the prices and of
# Google's usage report. The hard cap that cannot be wrong is on Google's side, and only the account
# owner can set it (AI Studio > Spend > Monthly spend cap, or prepaid billing with auto-reload off,
# which stops service the moment the balance reaches zero). See AGENTS.md, "Reader budget".

monthly_cap_usd: 10.00

decision:
  made_by: user
  date: 2026-09-21
  reason: >
    Use Gemini's Flash model for automated reading and keep usage low, about $10 a month at most.
  model_choice: >
    First gemini-3.8-flash, the newest stable Flash. Then the same day the user chose
    gemini-2.5-flash "as the volumes are super high for reading". It is $0.30 in / $2.50 out against
    3.8's $0.75 / $3.75, and Google announced no price step for it (3.8 doubles on 2027-01-01) and
    no shutdown date (deprecations page, retrieved 2026-09-21). 3.8 stays priced and configured so a
    quality comparison needs no code change.

model: gemini-2.5-flash

# How each model is called. Every priced model must have an entry, so that nothing runs unconfigured.
#   thinking_budget  tokens the model may spend reasoning; 0 turns thinking off (2.5 family). Thinking
#                    is billed as output, and reading is transcription, so we buy none of it.
#   thinking_level   3.x models cannot turn thinking off; this is the lowest level 3.8 Flash offers.
#   temperature      absent means Google's default. Google's Gemini 3 guide says to keep 1.0 there
#                    because lower values can loop and degrade; it says earlier models benefited from
#                    tuning. At 0 the model copies quotes more faithfully, which is what a
#                    transcriber wants. Nothing depends on it: the verifier checks every quote.
generation:
  gemini-2.5-flash: {thinking_budget: 0, temperature: 0}
  gemini-3.8-flash: {thinking_level: low}

# USD per 1,000,000 tokens, Standard tier, paid. Thinking tokens are billed as output tokens.
# The free tier costs nothing but its content may be used to improve Google's products, and Google
# decides the tier from the key's billing setup, which we cannot see, so everything is budgeted at
# the paid price: the ledger can only over-count.
#
# Prices change. Each entry is effective from its `from` date (UTC), and the LAST entry whose date
# has arrived applies. Google announced a step up on 2027-01-01, recorded here so that the ledger
# does not silently under-count by half in the new year.
prices:
  source: https://ai.google.dev/gemini-api/docs/pricing
  retrieved: 2026-09-21
  models:
    gemini-2.5-flash:
      - {from: 2026-01-01, input: 0.30, output: 2.50}     # text input; no scheduled change announced
    gemini-3.8-flash:
      - {from: 2026-01-01, input: 0.75, output: 3.75}     # "through December 31, 2026"
      - {from: 2027-01-01, input: 1.50, output: 7.50}     # "starting January 1, 2027"
