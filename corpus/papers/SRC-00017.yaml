reported: '“For GaN−V N, the RMSD of the 255-atom test supercell decreases from 0.037 ˚A for Training-set
  I to about 0.01 ˚A after including additional small-supercell data.”

  “For SiO 2 −V O, increasing the number of small-supercell defect configurations leads to a clear reduction
  of the energy error in the 323-atom test supercell, from 0.184 eV for Training-set I to 0.023 eV for
  Training-set III.”

  “Taking the Cu 2ZnSnS4 −Cu− Zn system as an example, when the training set consists only of 16-atom
  defect supercells, the total-energy prediction errors of the model for the 128-atom and 288-atom test
  supercells reach 21.231 eV and 51.484 eV, respectively.”

  “For the SiO2 −V 2+ O system, when only 17-atom defect supercells are used for training, the error of
  the model for the 323-atom test supercell also reaches 46.080 eV.”'
method_summary: “We use Allegro package [7, 8] to train the MLIP model.”
