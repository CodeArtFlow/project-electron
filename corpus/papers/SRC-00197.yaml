limitations: '“The reliance of epitaxial strain engineering on a finite number of available single-crystal
  substrates, many of which are not compatible with complementary metal-oxide-semiconductor technology,
  however, complicates continuous strain tuning and typically limits it to discrete values.”

  “Furthermore, because strain energy scales with film volume, large epitaxial strains (up to 4 %) are
  restricted to ultrathin films of a few unit cells in thickness.”'
