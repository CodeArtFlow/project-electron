reported: '“This leads to a decrease in the refractive index and tunes the BIC resonance by more than
  40 nm in the visible range.”

  “Exposure to HCl vapor initiates an anion-exchange reaction in which Cl− ions diffuse into the perovskite
  crystalline lattice”

  “After 306.5 min of exposure, the total spectral blueshift exceeds 40 nm, demonstrating exceptionally
  large post-fabrication reconfiguration of an all-dielectric metasurface operating in the visible spectral
  range.”

  “By fitting the temporal evolution of the optical response, we extract an effective diffusion coefficient
  of 1.0 × 10−10 cm2 s−1.”

  “To quantitatively describe the exchange kinetics, we developed a diffusion model that captures the
  coupled processes of surface anion exchange and subsequent Cl− transport within the perovskite metasurface.”

  “Pristine MAPbBr3 metasurfaces exhibit a pronounced nonlinear increase in emission intensity accompanied
  by a rapid linewidth narrowing, indicating the onset of polariton lasing at a pump fluence of 135 µJ/cm2
  (see SI Fig. S9).”

  “To investigate the stimulated emission characteristics, we performed angle-resolved photoluminescence
  spectroscopy as a function of excitation fluence for metasurfaces with different halide compositions,
  where the light source was a femtosecond laser (see Methods).”

  “After only 1.5 min of doping, a modest blue shift of the lasing wavelength from 545.5 to 541.3 nm is
  observed, corresponding to an energy shift of approximately 18 meV, while the emission linewidth remains
  nearly unchanged at 0.34 nm.”

  “After only 1.5 min of doping, a modest blue shift of the lasing wavelength from 545.5 to 541.3 nm is
  observed”

  “Consistent with the evolution of the gain-cavity detuning discussed above, the lasing threshold increases
  systematically with HCl exposure time.”

  “To determine the lasing threshold, we extracted the quality factors and emission wavelengths of the
  polariton modes as a function of excitation fluence by fitting the emission spectra with Lorentzian
  functions (Figure 4f,g).”

  “Extending the exposure to 3 min results in a more pronounced shift of ≈7.6 nm, accompanied by slight
  broadening to 0.38 nm.”'
method_summary: '“Nanoimprint master molds were fabricated by electron-beam lithography on fused silica
  substrates followed by lift-off process of Cr/Au, yielding structures with a period p = 280 nm, a line
  width d = 140 nm, and a modulation depth h = 50 nm (see Methods).”

  “For gas-phase doping, a 18.5 cm diameter Petri dish was placed on a hot plate at 50 ◦C. A volume of
  40 µL of 36.3% HCl was introduced into the dish, which was then sealed and allowed to equilibrate for
  5 min to generate a saturated vapor environment. The perovskite metasurfaces were subsequently exposed
  to the HCl vapor for a controlled duration t.”'
limitations: “After approximately 11 min of HCl exposure, however, no lasing is observed within the maximum
  available pump fluence.”
