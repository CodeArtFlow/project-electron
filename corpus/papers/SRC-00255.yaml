  “Transmission spectra at normal incidence under LCP, LP, and RCP excitation ( Fig. 4b ) measured using
  a home -built low -NA transmission microspectroscopy system reveal a pronounced chiral resonance with
  a Q-factor of 127.”'
method_summary: '“The chiral metasurface was fabricated using electron -beam lithography followed by inductively
  coupled plasma reactive-ion etching (see Methods for details).”

  “For third -harmonic generation (THG) measurements, the incoherent light source was replaced with a
  home-built wavelength-tunable optical parametric amplifier (OPA) used in Ref. 70 pumped by a pulsed
  laser (Amplitude Yuja, center wavelength of 1030 nm, repetition rate of 100 kHz, and pulse duration
  of 400 fs).”'
limitations: “The experimentally observed deviation of 𝑆3(3𝜔) from unity can be attributed to fabrication
