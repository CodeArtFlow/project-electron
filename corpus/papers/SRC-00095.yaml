reported: '“Ft-nano predicts a binding energy of 4.33 eV, compared with the DFT value of 4.81 eV, where
  the binding energy is defined as the energy required to separate the complex into isolated constituent
  point defects.”

  “To determine which complexes are preferentially formed at experimentally relevant oxygen contents,
  we perform Monte Carlo annealing at at 0.407 wt% oxygen. Initially dispersedO N impurities associate
  with Al vacancies to formVAl(ON)3 complexes (Fig. S4), supporting their thermodynamic preference under
  the simulated conditions.”'
method_summary: '“We investigate phonon scattering by oxygen-related defects using pretrained universal
  machine-learning interatomic potentials (MLIPs), molecular dynamics (MD), and phonon Boltzmann transport
  calculations.”

  “The lattice thermal conductivity is calculated by iteratively solving the linearized phonon BTE [30]
  using a modified ShengBTE package [31].”

  “In the SED approach, the defect scattering rate is estimated from the excess spectral linewidth of
  the defective supercell relative to the pristine supercell in MD simulations.”'
limitations: '“At high concentrations, however, the scattering rate deviates from linear scaling with
  oxygen content, suggesting limitations of independent-defect and pristine-phonon descriptions.”

  “Although SED spectra can still be evaluated for highly disordered crystalline systems, extracting well-defined
  phonon lifetimes becomes increasingly challenging as mode mixing and spectral broadening obscure individual
  phonon peaks.”'
