method_summary: '“In this work, the field-induced forces in Eq. (14) are coupled to the ionic relaxation
  procedure. At each ionic step, VASP converges the electronic state at the applied field, evaluates the
  forces, and passes them to the ionic optimizer to update the atomic positions while maintaining the
  field.”

  “For AlX (X=P, As, and Sb), the local density approximation (LDA) [58] in the parametrization of Ceperley
  and Alder [59] was used. We employed a plane-wave cutoff of 500 eV and a Γ-centered 16×16×16 k-point
  grid”

  “For AgNbO3, the Perdew-Burke-Ernzerhof (PBE) [64] approximation was employed for the exchange-correlation
  functional.”'
