method_summary: '“Our method computes physics-based migration barriers on a periodic network and analyzes
  the network through its topology and its graph spectrum.”

  “TSPD constructs a periodic migration network for the mobile ions. Each edge carries a migration-barrier
  profile computed from parameter-free physics.”

  “We sample the profile along an edge{u,v}at the positionsP(t) = (1−t)c u +tc v. The edge barrierB uv
  is the maximum energy along this path, measured from the global minimum energy of the mobile sites,E0”'
limitations: '“First, the energy scale is ordinal. The barrier of each edge ranks crystallographic directions
  and locates the bottleneck within a structure, but it is not a transport rate and does not give the
  absolute separation between competing directions.”

  “Third, strongly cooperative motion is not modeled, although its static precondition is often visible.”

  “Fourth, the input is a single ordered structure. Site disorder and partial occupancy enter through
  the vacancy response and not as a configurational average.”'
