reported: '“For the trilayer 1T ′-WS2 case, increasing the interlayer spacing opens a band gap and induces
  a QSHI phase reported for ∆d >0.18 ˚A (Fig. 6(c)).”

  “induces a QSHI phase reported for ∆d >0.18 ˚A”

  “We evaluate the indirect band gap and topological characterization at statically varied interlayer
  spacings using HSE hybrid-functional calculations for an accurate description.”'
method_summary: '“We relaxed the ground-state structures of monolayer, bilayer, and trilayer 1T ′-WX2
  (X= S or Se) using density functional theory as implemented in Quantum ESPRESSO 46.”

  “For the electronic-structure and topology analysis, we used the HSE06 hybrid functional 50 for monolayer,
  bilayer, and trilayer 1T ′-WX2.”

  “We performed Ehrenfest dynamics using a homemade rt-TDDFT code based on Quantum ESPRESSO and tested
  it with Octopus 41,53.”'
limitations: “Although our rt-TDDFT simulation does not provide enough interlayer spacing to compare with
  our static analysis of the topological phase transition, our first-principles calculation result may
  under- or overestimate the critical distance due to DFT inaccuracies in the band gap.”
