method_summary: '“Light from up to three tunable lasers (1530–1610 nm) is combined in fiber; a fraction
  is monitored on an optical spectrum analyzer. A function generator applies the sinusoidal bias between
  3 and 10 V. The photodiode is terminated in 100 Ω; a bias tee separates the DC photocurrent, recorded
  directly, from the AC component, which is amplified by a low-noise amplifier (1 kHz–1.8 GHz) and digitized
  by an oscilloscope as 8000 samples over one bias period, triggered by the function generator.”

  “Each dark-subtracted waveform is compressed onto 10–20 principal components, computed from calibration
  waveforms only, and a fully connected neural network maps them, together with the DC photocurrent, to
  the line wavelengths; a second network classifies the power of each line.”'
limitations: '“Consistent with the line coupling of Sec. 4.2, a linear inversion with a dictionary of
  measured single-line waveforms recovers single lines but not multi-line spectra (Table 3), confirming
  that the coupled response must be learned from calibration spectra of the same kind as those to be measured.”

  “On a new day the accuracy is set by slow day-to-day drift rather than by noise”

  “for three lines, recorded on fewer days, it remains above 1 nm, and calibration over more days, together
  with temperature stabilization of the photodiode and monitoring of the bias waveform, is the direct
  route to improving it.”'
