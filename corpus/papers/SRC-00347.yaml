reported: '“The device has a small footprint of only 6.3µm×31µm.”

  “A 1×2 photonic switch based on silicon-on-insulator (SOI)-Sb2Se3 hybrid platform is inverse-designed
  using direct binary search (DBS) and particle swarm optimization (PSO) algorithms.”

  “The device has a small footprint of only 6.3µm×31µm. At the wavelength of 1550nm, it exhibits an insertion
  loss of less than 0.96dB, and its crosstalk is measured to be less than -12dB within the three-dimensional
  (3D) finite-difference time-domain (FDTD) simulations.”'
method_summary: '“These diagrams are produced by the commercial software package Lumerical FDTD.”

  “For both optimizations, the 2.5D variational FDTD solver (varFDTD) of Lumerical Mode Solution is utilized
  for structural modeling and the obtained results are verified with Lumerical 3D FDTD (Fig. 2(b) and
  Fig. 3(b)).”'
limitations: '“It should be noted that both design rounds were performed within a metasystem composed
  of five phase-change metasurfaces in the SOI platform without the presence of tapers and waveguides
  and any confinement imposed by the switch body. This is because the varFDTD simulation time for such
  metasystem is much shorter than the simulation time of the complete 1×2 switch module shown in Fig.
  1(a).”

  “By transferring the finally optimized metasystem into the 1×2 switch module shown in Fig. 1(a), the
  total transmission of the system enhances (the FOM decreases to 0.7395), however, the performance of
  the system as a switch degrades, because of the increment of transmission through each output taper/waveguide
  at both states.”'
