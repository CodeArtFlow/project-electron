method_summary: '“Through simulation-based evaluation, we demonstrate that a single Hy- PAIC improves
  end-to-end (E2E) system throughput by up to 1.04×and TDP-normalized throughput by up to 3.59×during
  1T MoE model inference, compared with the aggregate performance of eight baseline systems without HBF.”

  “For our architecture-level simulation, we have extended NVIDIA AIConfigurator [63]. We add DGX Spark
  and HyPAIC sys- tem models to AIConfigurator v0.11.0 and implement a heterogeneous-memory operation
  mechanism where the KV cache is stored in LPDDR5x and weights are stored in HBF.”'
limitations: “Although HBF specifications are still evolving, this study demonstrates that integrating
  HBF into PAICs provides strong architectural synergy.”
