method_summary: '“Printed logic circuits based on ECM memristors were fabricated using laser ablation
  (Trumpf TruMicro 5000) for Au bottom electrode patterning and inkjet printing for the active layer deposition
  and the top electrode (Ag) deposition.”

  “The pulse amplitudes for initialization and logic operations are listed in Table I, where each pulse
  has a width of 200 ms, while the SET and XOR,1 pulses have a 3 mA compliance current.”

  “All operation voltages in Table I were determined experimentally by scanning the operation range, taking
  into account the boundary conditions proposed in [9] and [10].”

  “To evaluate workload-level throughput, we use a custom cycle-accurate simulator in which workloads
  are represented as Directed Acyclic Graphs (DAGs), with scalar additions as nodes and data dependencies
  as edges.”'
limitations: “Although the success rates of NOR and XOR are limited by device variability, the presented
