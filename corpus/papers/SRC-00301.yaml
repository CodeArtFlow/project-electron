reported: '“In the runtime library alone we discover 317 indirect-branch terminators and 517 non-trivial
  gadgets covering all five canonical ROP primitive classes, and we find gadgets in every one of 13 PrIM
  benchmarks [5].”

  “We run on the UPMEM DPU functional simulator (no physical PIM hardware) using the UPMEM SDK 2023.1.0
  from the CMU-SAFARI mirror [ 13], driven by the stock dpu-upmem-dpurte-clang and llvm-objdump 12.0.0
  .”

  “Its dynamic cost is therefore bounded by the return fraction times CPI, which comes out under 8% on
  the median kernel.”

  “A conservative software emulation of the same semantics would add five extra instructions per round
  trip, inflating the committed .text by roughly 40% at the median.”'
method_summary: “We run on the UPMEM DPU functional simulator (no physical PIM hardware) using the UPMEM
  SDK 2023.1.0 from the CMU-SAFARI mirror [ 13], driven by the stock dpu-upmem-dpurte-clang and llvm-objdump
  12.0.0 .”
limitations: '“Our results come from the UPMEM functional simulator rather than a physical DIMM.”

  “Our scanner parses llvm-objdump text rather than decoding raw bytes, so a gadget the disassembler fails
  to render would be missed; this makes our counts a lower bound.”

  “The functional simulator does not model cycle timing.”

  “We report bounds rather than a cycle-accurate measurement because the UPMEM functional simulator exposes
  only committed-instruction counts [ 13], and a cycle-level DPU model is itself future work (Section
  IX).”'
