id: SRC-00003
title: 100 nm Gate-Length N-Polar GaN/AlGaN Metal-Oxide-Semiconductor High Electron
  Mobility Transistor on a Si Substrate via Thin-Layer Transfer Technique
doi: 10.1088/1361-6528/aea85c
url: https://iopscience.iop.org/article/10.1088/1361-6528/aea85c
venue_id: nanotechnology
authors:
- name: Hu Wei
  affiliation: Xidian University
  corresponding: true
published_date: '2026-09-16'
retrieved_date: '2026-09-20'
access: abstract_only
oa_evidence: NONE ESTABLISHED. OpenAlex reported is_oa=true, version=publishedVersion,
  but the IOPscience page serves an Accepted Manuscript under a 12-month embargo and
  states the request is not from a subscribing institution. Only the abstract was
  readable.
reported: 'Abstract states a maximum drain current of 1.1 A/mm, on-resistance of 3.8
  ohm*mm, peak transconductance of 125 mS/mm and fT/fmax of 29/40 GHz for a 100 nm
  gate-length N-polar GaN/AlGaN MOSHEMT with 10 nm HfO2 gate dielectric. THESE NUMBERS
  ARE NOT EXTRACTABLE AS CLAIMS: they come from an abstract with no accessible method
  section.'
method_summary: Not disclosed to us. The method section is behind the embargo. Abstract
  indicates Ga-polar AlGaN/GaN epilayers on Si(111) transferred to Si(100) by surface
  activated bonding with substrate removal.
evidence_type: measured
grade: B
limitations: Access limited to the abstract, so no method, no figures, no error bars
  and no device count. Grade lowered from the venue default A to B because the method
  is not verifiable by us. Retained as a record of what we could NOT read.
