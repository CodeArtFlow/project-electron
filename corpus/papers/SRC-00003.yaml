  institution. Only the abstract was readable.
reported: 'Abstract states a maximum drain current of 1.1 A/mm, on-resistance of 3.8 ohm*mm, peak transconductance
  of 125 mS/mm and fT/fmax of 29/40 GHz for a 100 nm gate-length N-polar GaN/AlGaN MOSHEMT with 10 nm
  HfO2 gate dielectric. THESE NUMBERS ARE NOT EXTRACTABLE AS CLAIMS: they come from an abstract with no
  accessible method section.'
method_summary: Not disclosed to us. The method section is behind the embargo. Abstract indicates Ga-polar
  AlGaN/GaN epilayers on Si(111) transferred to Si(100) by surface activated bonding with substrate removal.
evidence_type: measured
grade: B
limitations: Access limited to the abstract, so no method, no figures, no error bars and no device count.
  Grade lowered from the venue default A to B because the method is not verifiable by us. Retained as
  a record of what we could NOT read.
