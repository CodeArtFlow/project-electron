reported: '“On Arrow, which lacks an MSC, GPU write time with CC is 2.07×that without CC.”

  “An L2-optimized GEMM workload on Orin degrades by 16% (from 2,680 to 2,250 GFLOPS) on UC memory.”

  “In contrast, selecting WB memory with GPU-side CC (Cv+Opt) bypasses the copy step without degrading
  write performance, reducing total time by 16%.”

  “We use Arrow to compare CPU UC/WB access costs with GPU-side CC (see Finding 2).”

  “We optimized OpenCV [90] by intercepting its memory allocator to employ unified memory, bypassing the
  copy.”

  “This eliminates copying without degradingReadperformance. It results in an 18% reduction in end-to-end
  time.”

  “We use Arrow to examine CPU-read cacheability (see Finding 2).”

  “During LLM inference with OpenVINO GenAI [91], model logits must be transferred to the CPU for sampling
  after each iteration.”

  “This retains zero-copy benefits while mitigatingWriteoverhead, achieving a 34% reduction in data transfer
  latency compared to the copy baseline.”

  “On Arrow, an initial optimization using WF and RA with CC (+CC) skipped the copy phase, but as shown
  in Figure 10 (right), it incurred a 1.5× Writetime penalty because Arrow lacks MSC and thehigh-intensity
  GPU writeswere bottlenecked by CC (see Finding 3).”

  “Sparse point cloud processing.In 3D spatial data processing, converting sparse point clouds to dense
  images on the GPU for CPU-side processing [117, 123] often incurs significant transmission costs.”

  “As shown in Figure 12 (left), evaluation on a 10-token prefill workload demonstrates a TTFT reduction
  of 11%.”

  “Conversely, whilegrid-level barriers(DL+Opt) introduced complexity due to deadlock avoidance, this
  effectively managed contention, reducing execution time by 14%.”

  “To apply Orin’s contention-control techniques (Figure 8), we optimized Demand Layering [ 53] on Orin,
  where operator source code can be modified directly.”

  “For the largest streaming transfers, GPU Read-Alone and Write-Alone on WB memory with two-way CC lose
  about 8% and up to 27% throughput, respectively, relative to their UC counterparts.”

  “We applied this workflow as a post-study extension to NVIDIA DGX Spark [111].”'
