limitations: “Write-write contention is outside these tests; atomic synchronization and contended locks
  are examined separately (§4.1.4). We assume that the driver and hardware apply the requested page size,
  cache policy, and coherence settings. The results provide empirical evidence for the tested platforms,
  configurations, and sharing model, without formal guarantees for general CPU–GPU shared-memory interactions.”
