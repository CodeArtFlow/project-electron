reported: '“Evaluation using Groth16 and Plonky2 shows that ZKPU achieves up to 144× speedup for NTT,
  13.6× for MSM, and approximately 7.2× end-to-end application speedup over state-of-the-art accelerators”

  “To evaluate ZKPU, we develop a cycle-accurate simulator that models the core computational kernels
  of both curve-based and hash-based ZKP protocols.”

  “For 256-bit NTTs, ZKPU provides an average speedup of 36.0× over PipeZK and 2.0× over LegoZK.”

  “ZKPU consistently outperforms UniZK, achieving an average speedup of approximately 9.5× across both
  applications.”

  “Plonky2 evaluation. Figure 11 compares the end-to-end proving latency of ZKPU with UniZK using benchmarks
  provided by the Plonky2 framework.”

  “In contrast, ZKPU composes 64-bit processing elements into modular multipliers of arbitrary widths,
  maintaining over 90% utilization across all supported operand sizes.”'
method_summary: '“To evaluate ZKPU, we develop a cycle-accurate simulator that models the core computational
  kernels of both curve-based and hash-based ZKP protocols.”

  “The key hardware components of ZKPU are implemented in Verilog and synthesized using Synopsys Design
  Compiler with the TSMC 16nm technology PDK at 300MHz to obtain area and power estimates.”'
