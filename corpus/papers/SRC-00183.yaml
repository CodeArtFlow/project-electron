method_summary: '“To investigate electrical control of magnon transport in LAFO, we performed nonlocal
  transport measurements in three-terminal devices comprised of a source, a drain and an electrical gate
  in between (Fig. 2(a)).”

  “Brillouin light scattering (BLS) microscopy, which probes the magnon population both beneath the gate
  and in the channel next to it”

  “To determine whether nonlinear damping can account for the observed turnover, we performed micromagnetic
  simulations of both the propagating magnon amplitude and the nonlocal signal.”'
limitations: “Our results show that SOT compensation of magnon damping is ultimately limited by nonlinear
  damping attributed to auto-oscillations”
