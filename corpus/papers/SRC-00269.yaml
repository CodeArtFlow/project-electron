limitations: '“Below it, in the stiff corner of high doping and long devices (W dep ∼20 nm), the errors
  are 10–20 times larger than in the central bins and only about 1% of the devices fall there, too few
  to calibrate, so we report no interval.”

  “Extrapolating in voltage degrades beyond that range, to a median error of 25% up to the built-in potential
  against 1.9% inside it, and it fails above the built-in potential, where the device enters a regime
  absent from the training data.”

  “The scope of the study is limited. The detailed analysis covers one doping family, a symmetric abrupt
  junction with a fixed relative smearing of the doping, constant mobility, long lifetimes and forward
  bias only.”'
