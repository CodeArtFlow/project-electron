method_summary: “By developing a full three-dimensional analytical model of the scattering process together
  with numerical simulations to design and evaluate the emitted field, we show that tilted waveguide Bragg
  gratings can act as integrated polarisation beam shapers.”
limitations: '“We find that scattering two co-propagating, orthogonally polarised pumps on a single grating
  is fundamentally limited: waveguide birefringence and the difference in scattering efficiency prevent
  full polarisation control.”'
