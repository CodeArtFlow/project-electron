reported: '“The refined displacements confirm this: Pb moves by 13 pm out of plane and 6 pm in plane,
  comparable to the 11 pm and 5 pm of Ti (Supplementary Table 2).”

  “We focus on the (PbTiO3)𝑛/(SrTiO3)𝑚 superlattice with𝑛=3and𝑚=5, where𝑛and𝑚are the layer thicknesses
  in unit cells.”

  “In the refined model, Sr and Ti in the spacers are displaced by 7 pm and 5 pm out of plane (Supplementary
  Table 2).”

  “The out-of-plane lattice parameter of the SrTiO3 layers, 𝑐 STO=3.947 Å, is expanded by about 1% relative
  to bulk SrTiO3 (𝑐=3.905 Å), consistent with a polar distortion of the spacers induced by the adjacent
  PbTiO3 layers.”'
