reported: '“and 3.52×/3.18× lower encryption/decryption cycle counts than a reference Cortex-M0 implementation.”

  “Set 1: (n,q) = (256,256) M33/M0 193.275/– 268.056/944.000 (3.52×) 126.568/403.000 (3.18×)”

  “reference Cortex-M0 implementation”

  “The Cortex-M33 Data Watchpoint and Trace (DWT) cycle counter measures key generation, encryption, or
  decryption with interrupts disabled, and correctness is checked outside the timed interval.”'
method_summary: '“The Cortex-M33 Data Watchpoint and Trace (DWT) cycle counter measures key generation,
  encryption, or decryption with interrupts disabled, and correctness is checked outside the timed interval.”

  “Using arm-none-eabi-objdump and arm-none-eabi-nm from the same toolchain, we inspected the application
  objects and final ELF file for secret-dependent branches and memory addresses, fixed loop bounds, removal
  of countermeasure operations, and recombination of Boolean shares.”

  “We perform four dudect-style tests covering polynomial multiplication during decryption and encryption,
  as well as both complete CCA2 operations. Each test collects 100,000 DWT measurements, divided equally
  between two classes, using the (n,q) = (256,256) firmware image.”'
limitations: '“Evaluation is limited to the tested binaries and components: fixed-versus-random timing,
  TVLA, and debugger-assisted single faults. Multi-target faults and electromagnetic or invasive injection
  are considered out of scope for this work.”

  “The six selector-store and loop-control skip trials reveal a narrower integrity limitation: skipping
  the final store or loop control silently corrupts a valid output, so output-selection duplication or
  a loop-completion check remains necessary.”

  “Sharing covers CPA decryption but not its surrounding oracle and re-encryption logic; fault results
  cover the tested single-point logical model.”'
