reported: '“The added logic (3,155 LUTs and 2,215 registers; 5.0% and 1.7% of the device) is dominated
  by the Ascon engine and preserves the 100 MHz clock, while estimated power rises from 118 to 368 mW.”

  “These modules occupy 5.0% of the XC7A100T’s 63,400 LUTs and 1.7% of its 126,800 flip-flops.”

  “Latency is measured with a Vivado Integrated Logic Analyzer (ILA), whereas resource, timing, and full-system
  power results come from separate non-instrumented post-implementation builds.”

  “Power is estimated in Vivado using identical estimation and switching-activity settings for both systems;
  no board-level power measurements are reported.”'
method_summary: '“Our developed prototype extends NEORV32 v1.12.8.3 on a Digilent Nexys A7-100T board
  with a Xilinx Artix-7 XC7A100T FPGA.”

  “Latency is measured with a Vivado Integrated Logic Analyzer (ILA), whereas resource, timing, and full-system
  power results come from separate non-instrumented post-implementation builds.”'
limitations: '“The prototype leaves NEORV32’s DMA controller disabled, requiring software to copy each
  protected packet from the wrapper to data memory and then load it into the CFU.”

  “In the prototype, the key is fixed in the FPGA configuration; a deployment would protect it with bitstream
  encryption or derive the key from a PUF [15], and would need per-device key provisioning.”

  “Lastly, the prototype holds one four-byte accelerometer packet at a time.”'
