method_summary: '“Here, we address this gap by using effective cluster interactions (ECI) obtained from
  density functional theory (DFT) calculations and subsequent statistical thermodynamics modeling to unravel
  the interplay between magnetism, composition, and temperature in body-centered cubic (bcc) Fe–Si alloys
  up to 20 at% Si.”

  “The temperature-dependent evolution of these ordering patterns, obtained from Monte Carlo simulations
  based on the magnetically resolved ECIs, reproduces the experimentally observed phase equilibria and
  short-range order characteristics.”'
