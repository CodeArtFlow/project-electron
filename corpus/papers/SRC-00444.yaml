reported: '“Profiles #1, #2, and #3 yield app values of about 93, 140, and 360 W m-1 K-1, respectively.”

  “For an Al (70 nm)/Si structure”

  “For an Al (70 nm)/Si structure, Fourier fits of synthetic TDTR phase signals give app of Si from about
  93 to 360 W m-1 K-1 for different interfacial transmission spectra, and app correlates with the heat-flux-weighted
   of the transmitted phonons.”'
method_summary: '“In this work, we employ the phonon Boltzmann transport equation (pBTE) to calculate
  temperature depth profiles in semi-infinite Si with varying spectral distributions of surface heat generation,
  which represents the spectrum of phonons injected across the transducer/substrate interface, and examine
  how this distribution influences app.”

  “We further simulate TDTR phase signals for an Al/Si structure with systematically varied interfacial
  phonon transmission spectra and fit them using a conventional multilayer Fourier model with app as
  one of the free parameters.”'
