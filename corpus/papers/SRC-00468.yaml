method_summary: '“We train the twin on powers alone [Fig. 1(b)]. For each of 4000 settings, all heater
  currents are set at random, light enters one input k of the chip, and the 12 output powers p are recorded.”

  “To measure φnorm ik of a block, we generate two coherent beams on the chip and fit their interference
  fringes (Fig. 3; equations in Methods).”

  “Light from a laser at 1550 nm passes a polarisation controller and a 1 × 12 optical switch that selects
  the input port of the chip; a second 1 × 12 switch selects the output port read by a power meter. Current
  drivers set the heater currents, and a temperature controller stabilises the chip”'
limitations: '“The remaining measured–twin difference, about 4×10−3 in output infidelity, is 81 times
  larger than the repeatability of the measurement and is not explained by thermal crosstalk between heaters
  (Supplementary Note 9); it reflects the accuracy of the model, which more training data or a richer
  description of the couplers and routing may improve.”

  “The on-chip protocols need free layers in front of the block, which limits the measured blocks to 10
  × 10 for the bridge chain and 7 × 7 for the fixed reference on this processor, and the measurements
  cover ten Haar-random and three complex Hadamard targets in the paired comparison and two targets per
  size in the placement sweep.”'
