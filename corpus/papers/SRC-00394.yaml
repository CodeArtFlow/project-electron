method_summary: '“First, we conducted time-resolved THz polarimetry by employing three optical pulses:
  NIR pump, THz probe, and NIR gate pulses, with the pulse sequence shown in Fig. 2(a).”

  “Two distinct relaxation components, fast and slow, were isolated using a double-exponential fit convolved
  with a Gaussian instrument response function (see Supplemental Material [29]).”

  “For comparison, we calculated the inverse of the L–L intervalley scattering rate of electrons 𝜏𝑒−1(ε)
  and the hole-phonon scattering rate 𝜏ℎ −1(ε) based on the deformation potential theory [34]”

  “Thus, as depicted in Fig. 3(a), we replaced the THz field with a static DC bias voltage along the positive
  𝑥 direction, and measured the resulting transverse photovoltage along the 𝑦 direction in a Hall bar
  configuration, with a lock-in amplifier referenced to the repetition rate of the pump pulses.”

  “To confirm the underlying mechanism of MIR-induced valley polarization, we conducted Monte Carlo simulations
  of electron scattering [23].”'
limitations: “Note that this estimation is based on the Drude model, which is not accurate for describing
