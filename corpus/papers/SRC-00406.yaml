method_summary: '“Bonded interfaces were made by placing two pieces of clean z-cut LNO single crystal
  on top of one another, with a relative twist in the orientations of their primary a-b crystallographic
  axes.”

  “Once bonded, cross-sections were cut and polished to allow focused ion beam milling of thin electron-transparent
  lamellae, incorporating the interface, with lamellar planar normals at a slight angle to the crystallographic
  c-axes of the LNO (fig. 1a).”

  “For DPC imaging, a segmented detector (ThermoFisher) was used to measure deflection of the transmitted
  electron beam.”

  “4DSTEM was acquired on a double-corrected JEOL ARM200F operating at 200 kV, in Nanobeam STEM mode,
  with a 3 mrad semi-convergence angle and equipped with a Quantum Detectors Merlin pixelated detector.”

  “Multislice ptychographic reconstructions were performed using PtyRAD [42], employing five probe modes,
  a slice thickness of 0.4 nm, and more than 1,000 iterations.”

  “The transport simulations down twisted multilayers employ the Hairy Probes method for electronic open
  boundaries [43].”

  “Second-harmonic generation (SHG) experiments are conducted using a mode-locked Ti:sapphire oscillator
  delivering 100 fs laser pulses at a central wavelength of 800 nm and a repetition rate of 80 MHz in
  an inverted optical microscope, with detection in a back-reflection geometry as described in Ref. [https://doi.org/10.1063/5.0037286].”'
