method_summary: “Run the test with Verilator. After every successful simulation, merge the new coverage
  into a running result with a per-bin max(), so a bin once hit is never lost; this is the union-merge
  idea of UCIS [Accellera Systems Initiative, 2012].”
limitations: '“(i) The LLM-generated directed tests are not independently checked in the loop. Only one
  test was checked by hand with the monitor. A test can close coverage with invalid stimulus, and we do
  not measure how often that happens.”

  “(ii) There are three small designs and 12 logged runs from several agent checkpoints, with no fixed-version
  repeated trials, no confidence intervals and no pass@k.”

  “(iii) There is no baseline, such as plain random re-seeding, a scripted strategy, or another LLM system,
  and no ablation of the single-bin target,LESSONS.md or clean_code().”

  “(v) The base testbenches are hand-built per design, so the agent’s input is not free. Base coverage
  therefore describes our testbenches, not a measured random-stimulus plateau; the 1000-seed runs mentioned
  above checked data integrity, not coverage.”

  “(vi) If clean_code() rejects the output, for example on a syntax error, the iteration is skipped and
  the model is not told why.”'
