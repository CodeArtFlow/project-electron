reported: “Solving the calculated effective Hamiltonian (1) in a single-site mean-field approximation
  (see Methods), we obtain a single phase transition atT N = 460 K to a collinear AFM structure shown
  in Fig. 1 that closely agrees with the one proposed by Ref. [21] on the basis of neutron diffraction
  measurements.”
method_summary: '“Here, we derive a full low-energy effective Hamiltonian for CoO, including orbital exchange
  terms, using an ab initio force-theorem approach based on DFT+dynamical mean-field theory.”

  “First, the electronic structure of paramagnetic CoO was calculated using DFTTools implementation [77–79]
  of DFT+DMFT provided by the TRIQS library [80] together with the Wien2k DFT code [81] and the Hubbard-I
  implementation provided by the MagInt package [82].”

  “The calculatedab initioeffective Hamiltonian (1) was solved in a single-site mean-field approximation
  using the ”McPhase” [89] package together with an in-house module for the single-site mean-field problem.”'
limitations: '“The theoreticalT N is overestimated by 56% compared to the experimental one of 294 K, as
  expected for a mean-field approach.”

  “Our effective Hamiltonian is apparently also insufficient to properly describe it, although some qualitative
  features of the experimental spectrum are present in Fig. 2.”'
