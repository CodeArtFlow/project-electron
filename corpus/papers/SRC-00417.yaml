reported: '“while a 4-SM GPU completes a 1024 × 1024 GEMM in 4.24 seconds, versus 26 hours in software
  RTL simulation.”

  “We present FoldSim, an automated framework that enables cycle- exact simulation of large RTL designs
  on a single FPGA through hierarchical folding.”

  “The full, 4-SM, and 8-SM GPUs and both datacenters are measured on the FPGA.”

  “versus 26 hours in software RTL simulation.”'
method_summary: '“On one AMD Alveo V80, FoldSim runs an 8-SM GPU and a 1,024- node Rocket datacenter with
  4,096 processor cores.”

  “All designs target an AMD Alveo V80 with 2.57 M LUTs and 32 GB HBM, using Vivado 2025.2, CIRCT [19,
  31], and SLASH, AMD Research’s open-source FPGA shell and runtime [32].”

  “The full, 4-SM, and 8-SM GPUs and both datacenters are measured on the FPGA.”'
limitations: '“A design larger than one SLR must therefore be split, and the split decides which links
  between classes cross between dies.”

  “The only structure it cannot order is a combinational loop through the ports of folded modules, where
  an output depends on itself within the same cycle; the compiler detects and rejects such designs.”

  “GDDR6 timing has been tested in simulation and synthesis but is not yet enabled through the deployed
  FPGA runtime.”'
