reported: '“The corresponding FWHM values were 63.4, 66.6, and 42.8 arcsec, respectively, demonstrating
  good crystalline quality across all three orientations.”

  “The crystalline quality was further evaluated using ω -rocking curves of the (020), (004), and (6̅03)
  reflections for the (010), (001), and (2̅01) epilayers, respectively, as shown in Figs. 3(b)-3(d).”

  “The crystalline structure, phase purity, orientation, and crystalline quality of the epilayers were
  evaluated using high-resolution X -ray diffraction (XRD) performed on a Rigaku SmartLab diffractometer
  equipped with Cu Kα radiation (λ = 1.5418 Å).”

  “In contrast, the surface within an individual terrace of the (2̅01) epilayer is highly smooth, exhibiting
  an RMS roughness of only 0.17 nm.”

  “The corresponding 2 × 2 µm² scans further reveal substantial differences in the local surface morphology.”

  “To quantitatively evaluate the nanoscale surface morphology, AFM measurements were performed on the
  (010), (001), and (2̅01) epilayers grown at 1150 °C, as shown in Fig. 5.”

  “Atomic force microscopy (AFM, Park XE-100) was used to examine the nanoscale surface morphology and
  determine the root-mean-square (RMS) surface roughness.”

  “Over the 5 × 5 µm² scan area, the (010) and (001) epilayers exhibit anisotropic elongated surface features
  with RMS roughnesses of 6.04 and 12.33 nm, respectively.”

  “In contrast, the (2̅01) epilayer exhibits well-defined step-and-terrace structures with a substantially
  lower RMS roughness of only 0.49 nm.”'
method_summary: '“The HVPE growth process utilized high-purity metallic gallium (99.99999%) as the gallium
  source.”

  “The crystalline structure, phase purity, orientation, and crystalline quality of the epilayers were
  evaluated using high-resolution X -ray diffraction (XRD) performed on a Rigaku SmartLab diffractometer
  equipped with Cu Kα radiation (λ = 1.5418 Å).”

  “The surface morphology of the as-grown epilayers was characterized using field -emission scanning electron
  microscopy (FESEM, JEOL JSM -7401F).”

  “Atomic force microscopy (AFM, Park XE-100) was used to examine the nanoscale surface morphology and
  determine the root-mean-square (RMS) surface roughness.”'
