method_summary: '“To describe the 2D nonlinear dynamics, we derived nonlinearly coupled equations for
  the amplitudes of axial modes Aq(θ, t) under the assumption that the spatial distribution of the field
  does not depend on the number of the azimuthal mode for large m em(r)≡e(r), Zm,q(z)≡Zq(z).”

  “Solving the eigenvalue problem of Eq. (2), we find the spatial distribution of modes Zl(z), with the
