  modes κ(c)l were determined, and also resonant frequencies ωml from the values of which the free spectral
  range D(1)l and the second-order dispersion of azimuthal modes D(2)l were calculated (see Table I for
  detailed values).”'
limitations: “To describe the axial distribution localized in a microresonator, we neglect the losses
