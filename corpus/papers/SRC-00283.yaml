method_summary: '“Ab initio calculations were used to simulate the kinetics of attachment of new segments
  of the crystalline lattice (pyramids) at steps on the nonmetal -terminated surface of tetrahedral semiconductors:
  GaN, GaP, GaAs and GaSb.”

  “Following previous papers (I-V) ab initio density functional theory (DFT) calculations were used for
  simulations of surface diffusion of the adsorbates in the nonmetal -terminated surfaces of semiconductor
  III-V crystals [7-20].”

  “For these tasks we selected the Spanish Initiative for Electronic Simulations with Thousands of Atoms
  (SIESTA) ab initio shareware package [7-9].”

  “The method is based on the nudged elastic band (NEB) method to optimize the path that has both endpoints
  fixed in the optimization [21-23].”'
limitations: '“Thus these results are introductory only, but they depict the universal model of step dynamics
  of the semiconductor growth based on introduction of “glue atoms” in the dynamics.”

  “Naturally, the number of atomic configurations of the step and the pyramids is large and would require
  considerable effort to obtain and categorize these processes. This area extends far beyond the scope
  of the research planned in this cycle. Here we would like to establish main features of these atomic
  processes.”

  “Therefore we present only limited set of simula tions of the attachments of the glue atoms from diatomic
  molecules from the vapor: N2 at 𝐺𝑎𝑁(0001̅) and P2 at 𝐺𝑎P(111̅̅̅̅̅) surfaces.”'
