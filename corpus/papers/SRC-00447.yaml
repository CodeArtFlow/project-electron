method_summary: '“Here, we use MD simulations based on machine-learned force fields trained on-the-fly
  on first-principles DFT calculations to model epitaxially strained MAPbI3 at 300 K.”

  “All calculations are performed using the Vienna Ab-initio Simulation Package (VASP) [46– 48]. We use
  the strongly constrained and appropriately normed (SCAN) meta-generalized gradient approximation [49]
  in the MD simulations”

