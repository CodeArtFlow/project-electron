  a previous report [14].”

  “Figure 2 shows low -temperature photoluminescence (PL) and PL excitation (PLE) spectra of the 2.8 eV
  band in HPHT diamond”

  “with boron concentration [B] = 0.2 ppm”

  “had activation energies of 0.20 eV below and 0.37 eV above the peak.”

  “strongly suggest that the 2.3 eV emission is linked with levels at EC-0.2 eV and EV+0.37 eV”

  “Fig. 4. Temperature dependence of phosphorescence from an HPHT diamond with impurity content <0.1 ppm.”

  “As shown in Fig. 4, t his broad band featured seconds-long kinetics and unusual temperature dependence
  that peaked upon heating at ca. 280 K and had activation energies of 0.20 eV below and 0.37 eV above
  the peak.”

  “This radius can be calculated as a = e2/(4πε0εEB) = 0.34 nm [29]”

  “where ε ~ 5.7 is the static dielectric constant”

  “and EB = 0.37 eV is the ionization energy of the boron acceptor.”'
method_summary: '“HPHT diamond crystals were synthesized at 6.5 –7.0 GPa using a cubic press and temperature
  gradient method .”

  “Polycrystalline diamond films were grown by chemical vapor deposition (CVD) on silicon substrate using
  an ASTeX PDS -17 microwave plasma reactor at the Institute for Materials Research in Belgium.”

  “Crystalline quality of diamonds was assessed by Raman spectroscopy using a WITec alpha 300R confocal
  microscopy setup equipped with 633 nm (HeNe), 355 and 532 nm (Nd:YAG) lasers.”

  “Concentrations of nitrogen and boron were measured by Fourier -transform infrared (FTIR) absorption
  with a Vertex70v spectrometer from Bruker .”

  “Time-resolved luminescence was excited with a nitrogen laser, which provided 3 ns 0.3 mJ pulses at
  3.68 eV (337 nm), and detected with a photomultiplier on a Tektronix oscilloscope.”'
limitations: “Detection limits were approximately 0.1, 1000, and 0.1 ppm for FTIR, EDS and SIMS, respectively.”
