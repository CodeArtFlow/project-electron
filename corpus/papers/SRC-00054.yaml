limitations: '“The theorem does not give the size of the neighborhood on which the manifold is invariant,
  nor of the domain of its parameterization; for the ASM-HEMT of Section VI the domain of the parameterization
  is set by the exponential diode gating of the drain-lag trap and extends only a few thermal voltages,
  nVT ≈26 mV , in the trap-voltage direction (Section VI-D).”

  “The theorem is stated at a fixed drive; a modulated drive is covered only by Proposition 1, which holds
  to first order in the ratio of the envelope rate to the electrical rates.”

  “Quasi-periodic forcing, for which the operating point is an invariant torus rather than a periodic
  orbit, will be the subject of a later study.”

  “The theorem singles out the manifold by its smoothness class, but the other invariant manifolds tangent
  to E differ from it by terms of order |ξ|Σ+1, far below what measured data could resolve; in practice
  the manifold is singled out by attraction, since every trajectory reaches it at the fast rates.”

  “The theorem also assumes the model is analytic on the operating region, true of compact models by construction
  but not of every fitted behavioral model.”'
