reported: '“In the idle scenario Spatz consumes only 8.36mW, thanks to its far less complex design.”

  “To ensure a fair comparison, all designs are taken through P&R targeting the same 500 MHz operating
  frequency, which we selected as a balanced point between performance and power consumption.”

  “Finally, the power estimation has been carried out with Synopsys PrimeTime 2025.06, using the TT 0.80V
  25°C corner.”

  “Under max load Spatz reaches a total power of 42mW, with the majority of consumption concentrated in
  the vector unit, particularly in the vector register file (15%) and vector functional units (40%).”

  “The latter is the Matrix Multiplication.”'
method_summary: '“The physical implementation for the three designs has been conducted in GlobalFoundries
  GF12 technology.”

  “The synthesis flow has been implemented with Synopsys Design Compiler NXT v2025.06 in topographical
  mode, using the SSPG 0.72V -40°C as the synthesis corner.”

  “The Place and Route has been performed using Cadence Innovus v23.33, considering all worst-case corners.”

  “The Post Layout simulations have been carried out using QuestaSim v2025.3.”

  “Finally, the power estimation has been carried out with Synopsys PrimeTime 2025.06, using the TT 0.80V
  25°C corner.”'
