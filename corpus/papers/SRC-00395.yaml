reported: '“Line-profile analysis demonstrates periodic oscillations of SHG signal along the c-axis (Figure
  1h), with an average period of ~ 1.5 μm, while the signal varies smoothly and monotonically along the
  b-axis (Figure 1i).”

  “Figure 1e presents the atomic force microscopy (AFM) image of the same flake shown in Figure 1c inset,
  confirming a uniform thickness of approximately 131 nm.”

  “The inset of Figure 1c shows the optical image of a representative exfoliated NbOCl2 flake transferred
  onto a SiO2/Si substrate.”

  “Substituting these values yields 𝜀 ≈ 0.26%.”

  “By applying the thin-film bending model,45 the maximum tensile strain 𝜀 at the apex of the bent NbOCl2
  layer is estimated using Equation (1):”

  “where h is the thickness of NbOCl2 (~89 nm), t is the height of the curved NbOCl2 (~92 nm), w is the
  width of the curved NbOCl2 (5.7 μm), and v is NbOCl2’s Poisson’s ratio (0.24).”'
method_summary: '“2D NbOCl2 flakes with different layer thicknesses were obtained by mechanical exfoliation
  and then transferred onto SiO2/Si substrates for further characterization.”

  “2D/1D NbOCl2/AgNW hybrids were prepared by a dry transfer method.”

  “Raman and SHG measurements were carried out at room temperature in a confocal Raman spectrometer system
  (WiTec Alpha 300R, Oxford instrument).”

  “The morphology and thickness of exfoliated 2D NbOCl2 flakes were characterized by combining optical
  microscope (Eclipse LV150N, Nikon) and atomic force microscope system (Asylum Research MFP-3D, Oxford,
  UK) with an AFM tip (Micromesh HQ:NSC14, k = 5) working at AC mode.”

  “Electric-field-induced phase transition experiments were conducted by a combined semiconductor parameter
  analyzer (B1500A, Keysight) and SHG spectrometer system.”'
limitations: '“Since the SHG signal of Region 2 also drops by about two orders of magnitude between 0°
  and 24°, part of the angular dependence is likely instrumental.”

  “It should be noted that this is an upper estimate. In an ~89 nm thick flake, the bending strain changes
  sign across the thickness, so the average strain probed is smaller.”

  “although a contribution from near-field enhancement of a residual ferroelectric signal by the AgNW
  cannot be fully excluded.”

  “A likely origin is an asymmetry of the two graphene/NbOCl2 contacts, which concentrates the field near
  one electrode. A contribution from bias-driven ion migration, which underlies the memristive switching
  reported for NbOCl2,28 cannot be excluded at present.”'
