reported: '“At equal photon flux, 365 nm pulses increase the photocurrent by 38 % while 455 nm pulses
  decrease it, and the depression reaching 30 % at higher flux, with up to 19 distinguishable levels per
  branch and no electrical energy spent.”

  “365 nm pulses increase the photocurrent by 38 %”

  “batch A was measured in December 2024 (zero -bias plasticity at 365 and 455 nm)”

  “The photocurrent in short circuit (0 V) was recorded during each light pulse”

  “Figure 1b compares trains of 60 pulses of 5 ms at 20 Hz under 365 nm and 455 nm light at the same photon
  flux, recorded three minutes apart on the same device.”

  “while 455 nm pulses decrease it, and the depression reaching 30 % at higher flux”

  “The device stack consists of ITO (150 nm) / ZnMgO (300 nm) / Se (500 nm) / MoO 3 (20 nm) / Au (80 nm),
  with an active area of 8 mm2.”

  “Se/ZnMgO photodiodes were fabricated on soda lime glass (SLG) and on 125 µm poly(ethylene terephthalate)
  (PET) substrates (product number 0081, GEOMATEC Co., Ltd, Japan).”'
method_summary: '“Light pulses were generated with Thorlabs fibre -coupled LEDs at 365 nm and 455 nm driven
  by a waveform generator controlling the pulse frequency, duration and number.”

  “The photocurrent in short circuit (0 V) was recorded during each light pulse with a Keysight 34461A
  digital multimeter triggered by the waveform generator, with 3 to 5 samples per pulse.”

  “For batch B, the persistent photoconductance was monitored by recording the current under a read voltage
  (0.5 V for the reset and relearning experiments, about 0.7 V for the flexible device) while 455 nm light
  pulses were applied, and the conductance was calculated as 𝐺 = 𝐼/𝑉read.”'
limitations: '“The qualitative behaviour is reproduced over the devices which we fabricated, but the crossover
  photon energy changes between the two fabrication batches.”

  “We are not yet capable of fully controlling the defects at the interface and therefore the crossover.”

  “The retention, from minutes to tens of minutes, places the devices in the short-term plasticity regime,
  which is suitable for adaptive sensing and reservoir -type processing but not for long-term storage
  of weights.”'
