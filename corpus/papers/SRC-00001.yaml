license: arXiv non-exclusive license
reported: 'Minimum energy-delay product of 1.23e-26 J*s for the low-threshold PFAL Buffer/NOT cell at
  V_CLK = 0.6 V and f_CLK = 7.94 GHz. PFAL preserves an energy benefit over static CMOS of up to roughly
  5x at reduced frequencies and elevated supply voltages. With a parallel-coupled quadrature VCO as a
  non-ideal four-phase power-clock generator, the Buffer/NOT energy stays within 2% of the ideal sinusoidal
  case at 3 GHz. Three sources of non-adiabatic loss are identified: threshold-voltage-related loss in
  the PMOS/NMOS latch, a previously unreported redundant charging of the output node, and loss related
  to PFAL logic tree complexity. [Addendum 2026-09-21, from the conclusions] Across the functional region,
  PFAL maintains an energy advantage over static CMOS of up to approximately 5x at the most favorable
  operating points (V_CLK = 1 V and f_CLK = 100 MHz).'
method_summary: 'Cadence transient circuit simulation of a PFAL standard-cell library in the TSMC 16 nm
  FinFET process. No fabricated silicon; all figures are simulated. Comparison baseline is static CMOS
  simulated in the same process. Body text: Cadence transient simulation; the static CMOS baseline is
  simulated in the same process.'
evidence_type: simulated
grade: B
limitations: Simulation only - no measured silicon. Single process (TSMC 16nm FinFET). Static CMOS baseline
  is itself simulated rather than measured. The 'roughly 5x' figure is stated approximately in the abstract
  without a tolerance.
read_scope: abstract; introduction; the simulation-method paragraph; the conclusions; figure captions
  and the passages that state each recorded number. The PDF was fetched in full but not read end to end,
  and no figure or table image was viewed.
