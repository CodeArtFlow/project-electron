reported: '“The SLM is illuminated at near-normal incidence by a collimated Gaussian beam of 1/e2 intensity
  radius w SLM = 3 mm, well within the active aperture, with its polarization aligned to the modulation
  axis of the liquid crystal.”

  “collimated Gaussian beam of 1/e2 intensity radius w SLM = 3 mm”

  “A lens of focal length f = 200 mm placed after the SLM performs the Fraunhofer transform of the reflected
  field onto the camera, giving the focal field”

  “A lens of focal length f = 200 mm placed after the SLM”'
method_summary: '“The SLM aperture is divided into square patches, each randomly assigned to one of three
  phase ramps that steer light to three independent foci: two phase-locked beams and a dump that takes
  up the surplus power.”

  “We observe the beams in the focal plane of a lens.”

  “A lens of focal length f = 200 mm placed after the SLM performs the Fraunhofer transform of the reflected
  field onto the camera, giving the focal field”

  “To verify this experimentally, we set α = 1/2 and βB = 0, and scan βA from 0 to 1, for which Eq. (8)
  predicts IA/IB = 1 − βA.”

  “To compare with this ensemble average, we experimentally generate N = 100 independent random masks
  per patch size and record the focal intensity for each.”'
limitations: '“The error bar is set by the signal-to-noise ratio of the fringe peak, and therefore grows
  as the fringes lose contrast. Beyond βA = 0.7 focus A is too weak for the fringes to hold contrast,
  and those points (open markers) are excluded from the rms deviation quoted above.”

  “The targeted parameters α, βA, βB are continuous: they set assignment probabilities rather than displayed
  phase levels, and how closely a given draw realizes them is limited by the number of patches under the
  beam, i.e. by the seed-to-seed spread above.”

  “The cost of the random encoding is the halo, which carries a fraction 1 − ∑c ξ2c of the total power
  Ptot.”'
