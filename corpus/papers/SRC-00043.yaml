method_summary: '“We prepare hBN-encapsulated MoSe 2/Fe3GaTe2 heterostructures by mechanical exfoliation
  followed by deterministic transfer [33, 34] (see Methods)”

  “We then measure the magneto-optical response of the MoSe2/Fe3GaTe2 heterostructure with a custom-built
  MOKE spectroscopy setup at 40 K (see Methods).”

  “To quantify the Kerr resonances, we fit ∆θ K with Eq. (1) phenomenologically using N = 4, corresponding
  to the resonances X 1s A , X 2s A , X 1s B , and X 2s B .”'
limitations: '“We do not resolve a trion feature in the Kerr spectra: a trion component with free position,
