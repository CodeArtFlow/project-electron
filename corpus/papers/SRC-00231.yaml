method_summary: '“By converting a conventional low-energy electron microscope[30,31] to pulsed operation,
  we combine nanometre-scale imaging with the pronounced surface sensitivity of few-electronvolt electrons.”

  “We introduce ultrafast low-energy electron microscopy (ULEEM), exploiting the intrinsic surface sensitivity
  of few-electronvolt electrons.”

  “The generation and propagation of laser-induced elastic waves are modeled by solving the coupled transient
  heat-conduction and linear elastodynamic equations in COMSOL Multiphysics 6.3 using a two-dimensional
  plane-strain finite-element model.”'
limitations: “In conventional electron and optical microscopy, phase variations of the wavefront are not
