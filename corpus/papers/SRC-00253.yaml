  “The drive vector u is generated digitally on the PC and converted into 32 analog drive voltages by
  a 32-channel, 16-bit digital-to-analog converter (DAC). These voltages drive the PM array, and the resulting
  phase-modulated optical signals propagate through the fixed photonic encoding core. After on-chip photodetection,
  the 17-channel analog encoded outputs z ∈ ℝ17 are digitized by an 18-bit analog-to-digital converter
  (ADC).”'
