method_summary: '“We measure the MOT temperature using time-of-flight (TOF) absorption imaging 45,46.”

  “We measure the MOT atom number using two independent methods: absorption imaging and fluorescence detection
  47,48.”

  “The absolute frequency stability of the SAS-locked cooling laser is measured against a self-referenced
  fiber frequency comb (Vescent FFC-100) whose repetition rate is phase-locked to a 1 Hz-linewidth ULE-cavity-stabilized
  laser (Stable Laser Systems) / Rb-disciplined, GPS-referenced oscillator (SRS-FS725).”'
limitations: '“The limitations of the present implementation arise from the actuators rather than the
  photonic architecture. The ring intensity modulator provides 6.3 dB of extinction, but only 2.2 dB can
  presently be used because tuning its resonance close to the laser frequency introduces resonant back-reflection
  that injection-locks the cooling laser and pulls it from the SAS lock point (Extended Data Fig. 5).”

  “The thermo-optic actuators also limit the intensity-control bandwidth to approximately 2 kHz, so full
  extinction during time-of-flight measurements currently requires switching off the cooling-laser current.”'
