reported: '“The initial structure was built by twisting two √626 × √626 × 5 STO layers by 4.62°.”

  “The final structure was averaged over the last 25 ps of the total 100 ps trajectory at the temperature
  of 300 K.”

  “The MD simulations were performed with GPUMD[52].”

  “The projector augmented- wave method was used with the kinetic cutoff energy of 800 eV together with
  a k- mesh spacing of 0.3 Å −1[55].”

  “The DFT relaxations used for the training data were performed with the Vienna Ab initio Simulation
  Package (V ASP)[53]”

  “For the formation of the reconstructed interface, the transferred double -layer SrTiO3 samples were
  heated to 750 °C at a rate of 5 °C min⁻¹, maintained at 750 °C for 2 h, and then naturally cooled to
  room temperature under the same oxygen atmosphere (oxygen pressure regulated to 0.4 MPa).”

  “under the same oxygen atmosphere (oxygen pressure regulated to 0.4 MPa).”

  “Figures 2c and 2f show the reconstructed sample after annealing at 750 °C for 2 h in an oxygen atmosphere.”'
method_summary: '“To investigate the structural reconstruction of the twisted interface, we developed
  a machine learning potential (MLP) based on density functional theory (DFT) calculations (see Methods)
  and performed molecular dynamics (MD) simulations.”

  “A series of SrTiO3 (STO) films with controlled thicknesses (15, 20, 25 unit cell thickness (u.c.))
  were grown by molecular beam epitaxy (MBE) [35,36] on approximately 3.5 u.c. water-soluble Sr4Al2O7
  sacrificial layers deposited on STO (001) substrates.”

  “Atomic-resolution STEM imaging was performed on an aberration- corrected FEI Titan Cubed G2 60–300
  S/TEM operated at an accelerating voltage of 300 kV”

  “STEM–EELS measurements were conducted on a probe -aberration-corrected JEOL JEM -ARM300F microscope
  (Grand ARM, JEOL Ltd., Tokyo, Japan) operated at 300 kV and equipped with a Gatan K3 direct electron
  detector.”

  “The local ferroelectric properties were measured on freestanding films on a conducting Si wafer using
  an Asylum Research MFP-3D Origin+ SPM scanning probe microscope.”

  “Experiments were performed using a Microwave Im pedance Microscopy by PrimeNano ScanWave TM.”'
limitations: '“It should be noted that, in cross-sectional specimens, the AA and AB region signals are
  not pure due to unavoidable SP contributions along the thickness direction. Thus, our results are more
  suitable for comparing relative trends than for determining abs olute polar-distortion values.”

  “The oxygen sublattice, however, exhibits a systematic apparent displacement, consistent with the strong
  sensitivity of iDPC imaging to specimen tilt and residual imaging distortions.”

  “Besides, the reconstructed registry produces projection overlap that prevents unambiguous assignment
  of individual oxygen columns”

  “Quantitative Ti3+/Ti4+ fitting and O-K edge analysis do not reveal a clear moiré-periodic signature
  (Extended Data Fig. 20).”

  “It is worth noting that, in the 4.62° twisted system, the moiré period is well below the lateral resolution
  (several tens of nanometers ) of conventional PFM [50] and sMIM [51].”'
