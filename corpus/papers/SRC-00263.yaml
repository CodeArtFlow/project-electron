method_summary: '“Constant -final-state photoelectron yield spectroscopy (CFS-YS),16,17 which measures
  photoelectron yield at a fixed kinetic energy while varying photon energy, detects weak spectral features
  with a higher signal-to-noise ratio than HS-UPS.”

  “For HS-UPS, monochromatic photons at 7.7 eV irradiated the sample, and an electrostatic hemispherical
  electron analyzer (PSP RESOLVE120) measured the kinetic energy distribution of emitted photoelectrons.
  The same setup was used for CFS-YS.”

  “The charging simulations calculated charge transfer at the metal/SiO₂ interface under thermal equilibrium
  using the occupied DOS measured by CFS-YS.”'
limitations: “However, the simulations assumed thermal equilibrium, whereas actual CE may involve nonequilibrium
