reported: '“Our spike-gated lowering reduces simulated inference time by 64× (453.2 ms to 7.04 ms)”

  “We demonstrate Stratum on a two-layer N-MNIST network with three controlled comparisons: (i) dense
  vs. spike-gated lowering of snn.linear”

  “For reference, the dense lowering passes the same functional check and measures 453.176 ms (906,352,779
  cycles) on the first test image.”

  “and our spike-major layout cuts it by a further 37.2% (to 4.42 ms) at 4 MiB L2, with the predicted
  class unchanged.”

  “The layout speedup grows from 1.59× to 1.88× when L2 shrinks to 1 MiB.”'
method_summary: “The default gem5 configuration models an out-of-order RISC-V core (RiscvO3CPU) operating
  at 2 GHz, with decode, rename, dispatch, and commit widths of 4, an issue width of 8, a 128-entry reorder
  buffer, 128 integer and 128 floating-point physical registers, and a tournament branch predictor.”
limitations: '“The active-spike scan is the largest stage, at 38.6% of marked cycles (3.79 M), ahead of
  the gather at 29.3% (2.88 M), the first LIF layer at 22.6% (2.22 M), and fc2 with its LIF layer at 9.5%
  (0.94 M).”

  “Since the scan cost depends on the input width rather than on the number of active spikes, much of
  the inference cost will not shrink as spike activity falls.”'
