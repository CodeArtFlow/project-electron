reported: Optimized single-gate PFAL cells achieve up to 3.83x lower energy than equivalent
  static CMOS gates. Sinusoidal excitation improves energy by up to 1.32x compared
  with trapezoidal excitation and extends the valid operating range. A 4-bit Brent-Kung
  carry look-ahead adder reaches a gain of up to 5.3x compared with the static CMOS
  energy estimate for the triangular power-clock. The power-clock sweep shows the
  minimum-energy waveform approaches a triangular shape rather than a conventional
  trapezoid.
method_summary: PFAL gate library designed, verified and characterised in the TSMC
  16 nm FinFET process by energy-delay-product optimization over power-clock amplitude,
  frequency and waveform shape. Simulation only. The adder comparison uses a static
  CMOS energy ESTIMATE rather than a full static CMOS simulation.
evidence_type: simulated
grade: B
limitations: Simulation only. Same three authors and same institution as SRC-00001,
  so the two are not independent sources. The 5.3x adder figure is against an estimated
  rather than simulated static CMOS baseline.
