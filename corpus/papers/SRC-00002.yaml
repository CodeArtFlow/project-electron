reported: 'Optimized single-gate PFAL cells achieve up to 3.83x lower energy than equivalent static CMOS
  gates. Sinusoidal excitation improves energy by up to 1.32x compared with trapezoidal excitation and
  extends the valid operating range. A 4-bit Brent-Kung carry look-ahead adder reaches a gain of up to
  5.3x compared with the static CMOS energy estimate for the triangular power-clock. The power-clock sweep
  shows the minimum-energy waveform approaches a triangular shape rather than a conventional trapezoid.
  [Addendum 2026-09-21, from the body] Table 2 (minimum-energy points of the trapezoidal power-clock sweep)
  gives reductions versus CMOS of 3.65x (Buffer/NOT), 3.83x (AND/NAND) and 3.71x (XOR/XNOR). Fig. 10:
  the strongest improvement of sinusoidal over trapezoidal excitation, 1.32x, is reached by the XOR/XNOR
  gate at V_CLK = 0.5 V and f = 384 MHz (Buffer/NOT 1.19x, AND/NAND 1.18x). The 4-bit Brent-Kung CLA reached
  a gain of up to 5.3x compared with the architecture-matched static CMOS energy estimate for the triangular
  power-clock.'
method_summary: All transistor-level simulations were performed in Cadence Virtuoso using the TSMC 16
  nm FinFET process design kit, with transistor models based on BSIM-CMG (stated in the body). Simulation
  only; no fabricated silicon. Single-gate baselines are simulated static CMOS gates; the adder baseline
  is an ESTIMATE.
evidence_type: simulated
grade: B
limitations: Simulation only. Same three authors and same institution as SRC-00001, so the two are not
  independent sources. The 5.3x adder figure is against an estimated rather than simulated static CMOS
  baseline. The paper states the static CMOS reference energy for the adders was estimated by summing
  individually measured energies of the corresponding static CMOS gates, an approximation that neglects
  inter-gate loading effects.
read_scope: abstract; the body passages that state 3.83x, 1.32x and 5.3x (Table 2, Fig. 10 captions, results
  and conclusions); the simulation-method paragraph; the note on how the static CMOS estimate was built.
  The PDF was fetched in full but not read end to end, and no figure or table image was viewed.
