method_summary: '“To demonstrate p-wave spin polarization in BFO, we performed density functional theory
  (DFT) calculations within the generalized Bloch theorem for magnetic spirals (see Methods).”

  “To experimentally confirm p-wave magnetism from the cycloidal spin order in BFO and to clarify the
  direction of its spin splitting, we perform a combination of Piezoresponse Force Microscopy (PFM), NV
  center magnetic imaging, and anisotropic circular photogalvanic effect (CPGE) measurements, as shown
  in Fig. 2.”

  “As shown in Fig. 2c, the anisotropic CPGE measurements are performed on a device consist of two parallel
