reported: '“VCSEL Array (97.0%): Achieves near-ideal accuracy (within 0.1% of the 97.1% reference) even
  under full E3 stress.”

  “Experiment E4 isolates the architectural impact of optical source organization by holding the workload
  (MNIST MLP), modulator (MZM), detection mode (incoherent), precision (8 bits), and combined E3 stress
  profile (σshot = σRIN = σdrift = 0.01, ER = 30 dB, Lins = 3 dB) completely fixed while varying only
  the optical source topology.”

  “Single-Laser Parallel Fanout (44.5%): Suffers an accuracy penalty of 52.5 percentage points relative
  to the VCSEL array arising, under the modeled simulation conditions, from the combined effect of 1/N
  optical power partitioning (reducing detected signal power relative to shot noise and extinction floor)
  and spatially correlated RIN perturbing all vector elements coherently.”

  “Single-Laser Time-Serialized (77.0%): Outperforms parallel fanout by +32.5% because full master laser
  power P0 is delivered to a single active channel per time slot without 1/N power division, mitigating
  shot-noise degradation while still experiencing temporal RIN and drift across sequential steps.”'
method_summary: '“We present PISim, a unified Photonic Inference Simulator that couples pretrained deep
  neural network execution with physics-based models of six accelerator architecture families, six electro-optic
  modulator technologies, four optical source organizations, and direct or coherent readout schemes.”

  “PISim implements an analytical schedule accounting model that decomposes end-to-end inference into
  five explicit stages for a matrix-vector tile of size W × H mapped onto an array of physical emitter
  width Nw and Ntiles parallel tiles”'
limitations: '“Here, normalized parameters such as σRIN = 0.01 (as well as σshot = 0.01 and σdrift = 0.01)
  are controlled, dimensionless simulation sensitivity parameters and should not be interpreted as calibrated
  physical measurements from a specific laser or photonic device.”

  “Crosstalk, nonlinear optical effects, speckle, and phase noise remain disabled.”'
