limitations: '“While technology improvements are being made to increase this ceiling, computation inherently
  involves multiple write operations–preset and logic operation. Active computation at hundreds of MHz
  localized to the same cells can rapidly exhaust what seems to be an large amount of cell endurance,
  and a compute algorithm’s non-uniform application of compute can require measures such as load-balancing
  and address remapping to prevent premature failure [26].”

  “Modern Hopfield networks the dot product more expensive, as the state vector now has multi-bit precision.”

  “The NV-CiM array faces a number of significant challenges for the more recent network types. Unlike
  the Classical Hopfield, the simple threshold function that can be calculated locally to a column has
  been replaced. The update process requires expensive non-linear value calculation, where the most gracefully
  scaling option is some external LUT or hardware.”'
