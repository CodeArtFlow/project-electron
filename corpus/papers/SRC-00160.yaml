method_summary: '“A pulsed laser system (355 nm wavelength, 1 ns pulse width) generates individual laser
  pulses with energies ranging from 1µJ to 10µJ.”

  “A coaxial microscope system facilitatesin-situobservation of the laser ablation and the resulting transfer
  displacement at an resolution of 0.97µm, thereby aiding in the evaluation of transfer precision and
  the optimization of process parameters.”

  “Furthermore, a cross-correlation image processing method is employed to precisely quantify the placement
