method_summary: '“We combine multiscale convolution with spatial detail from skip connections and independent
  supervision that allows overlapping regions to localize streaks and candidate Kikuchi regions separately.”

  “Using manual polygon annotations made before model-assisted editing, the Kikuchi intersection-over-union
  (IoU) on 29 laboratory test images from separate growth batches was 0.6290±0.0137.”

  “We then performed supervised adaptation to public chalcogenide images and stratified images by Kikuchi
  visibility using the median ratings of three observers who rated the images separately, two of whom
  rated with predictions hidden.”'
limitations: '“Public-image adaptation used reference masks of mixed provenance, including prediction-derived
