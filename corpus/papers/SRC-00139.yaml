reported: '“In NbMnTe 2, rotation fromytoxreducesC 11 from 71.1 to 64.0 N m −1 andC 22 from 59.5 to 38.1
  N m−1, a 36% reduction inC 22.”

  “Direct elastic calculations verify the predicted stiffness control (Table S5).”'
method_summary: '“We performed spin-polarized DFT calculations using the PA W method in V ASP with the
  PBE functional, a 500 eV plane-wave cutoff, a 9×13×1kmesh, and Dudarev Hubbard parametersU eff = 5.25
  eV for Mn and 1.13 eV for Nb, obtained by linear response (Fig. S13).”

  “Finite-displacement phonons were calculated with Phonopy in 2×2×1 supercells, from which the lattice
  entropy and heat capacity were obtained.”

  “Isotropic exchange and DMI parameters were extracted with the LKAG formalism in TB2J from SIESTA calculations
  based on the V ASP-relaxed structures.”

  “Together with the orthorhombic anisotropy, these parameters define a classical spin Hamiltonian, which
  was simulated with V AMPIRE to obtain the Curie temperatures, field- and temperature-dependent magnetization,
  and magnetic heat capacity.”

  “For NbMnSe 2, SOC-included bands were mapped onto maximally localized Wannier functions comprising
  Mn and Nb dand Seporbitals. Conductivities were then calculated with WannierTools using the semiclassical
  Boltzmann equation in the constant-relaxation-time approximation and a 111×171×1 mesh.”'
limitations: '“These comparisons do not by themselves establish a synthesis route, but together with the
  phonon and finite-temperature tests they show that the predicted magnetic states occur in well-defined
  metastable monolayers rather than mechanically unstable structures.”

  “This endpoint interpolation does not replace an explicit finite-temperature spin–phonon calculation,
  but it isolates the leading thermodynamic consequence of the calculated entropy difference between the
  ordered and disordered magnetic states.”

  “This estimate characterizes the anisotropy-energy scale rather than a coercive field, which will depend
  on the actual switching pathway and domain structure.”'
