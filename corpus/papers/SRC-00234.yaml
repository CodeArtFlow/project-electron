reported: '“Magnetic dead-layer analysis yields an interfacial dead-layer thickness of approximately 9
  Å per interface, accounting for the suppressed magnetization in thinner Ni layers.”

  “The intercept gives δ ≈ 9 Å, slightly exceeding the value reported for discontinuous Si/Ni MLs [33].”

  “the variation of Ms.tNi with tNi at 300 K is plotted in Fig. 3 and fitted with a straight line.”

  “The corresponding crossover thickness, tc, at which the effective anisotropy changes sign, is determined
  by tc = −2Ks/Kv, giving tc ≈ 27 Å.”

  “This value should be interpreted as a model-based extrapolation rather than direct evidence of a reorientation
  transition, as the continuous layer approximation may become unreliable for the thinnest samples.”'
method_summary: '“Magnetic hysteresis measurements were performed at room temperature using a vibrating
  sample magnetometer (VSM) integrated into a Physical Property Measurement System (PPMS; Quantum Design,
  USA).”

  “Dynamic magnetic properties were investigated using a JES-FA200 electron spin resonance spectrometer
  (JEOL) operating at 9.443 GHz.”'
