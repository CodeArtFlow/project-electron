method_summary: '“Ab initio calculations were used to simulate surface diffusion of adsorbates on the
  nonmetal - terminated surface of tetrahedral semiconductors: GaN, GaP, GaAs and GaSb.”

  “The diffusion jumps of these adsorbates : pyramids and single Ga adatoms, are modeled by ab initio
  DFT calculations.”

  “For these tasks, we used the Spanish Initiative for Electronic Simulations with Thousands of Atoms
  (SIESTA) ab initio shareware package [7-20].”

  “The method is based on the nudged elastic band (NEB) method to optimize the path that has both endpoints
  fixed in the optimization [21 -23].”'
