reported: '“Across 20 designs, Dr. RTL achieves average improvements of 21.3% in worst negative slack
  (WNS) and 16.9% in total negative slack (TNS), together with a 5.8% area reduction and an 86% SEC pass
  rate [13].”

  “E-Layout reports average improvements of 6.07% in TNS and 2.29% in WNS, together with a 1.07% area
  reduction across nine designs [12].”

  “CircuitProver [ 46] completes all 63 evaluated tasks, compared with 58 for its baseline, while reducing
  average proof rounds from 9.2 to 4.6.”'
method_summary: '“Our AssertLLM2 [41] benchmark evaluates assertion quality across 83 designs through
  syntax checking, formal verification, coverage analysis, and mutation testing.”

  “CircuitProver [ 46] combines hardware-aware proof planning with a reusable Lean library for circuit
  property verification.”

  “CorrectRTL [39] introduces an SVA-based self-correction framework for LLM-generated RTL.”

  “Dr. RTL [13] uses timing reports and EDA feedback to guide agentic RTL transformations, with sequential
  equivalence checking (SEC) validating functional correctness.”'
limitations: '“Claude Sonnet 4.5 achieves 93.04% syntax success and 65.65% structural reach, but only
  23.30% proof coverage and an 11.69% bug-kill ratio.”

  “The main challenges include accurate root-cause diagnosis, efficient repair search, and sufficient
  specification coverage to prevent incomplete or misleading fixes.”'
