reported: '“The surrogate reduces the mean absolute percentage error (MAPE) from 55.7% of latency-bandwidth
  models to 11.8%, and reduces evaluation time from 2.38∼75.70 s to 20.5 µs per operation.”

  “To enable faster superpod evaluation for further interconnect exploration, we derive a surrogate model
  that combines OTP parameters with analytical models of PEX mechanisms.”

  “and reduces evaluation time from 2.38∼75.70 s to 20.5 µs per operation.”'
method_summary: '“To make protocol effects explicit, ProtoBridge introduces two abstraction layers over
  ns-3 to evaluate different scale-up protocols using a common simulation substrate: (1) an operation-to-packet
  (OTP) layer that captures protocol-specific packet exchanges and dependencies, and (2) a packet-execution
  (PEX) layer that applies shared packet-level mechanisms to the ns-3 event system.”'
limitations: '“The high simulation time also hinders efficient end-to-end superpod evaluation and design
  exploration.”

  “Large errors occur at medium data sizes, which are caused by the NCCL software overhead not modeled
  at the protocol layer.”'
