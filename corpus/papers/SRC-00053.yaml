reported: '“One of the first demonstrations of enhanced HHG in this platform was the observation of fifth-harmonic
  generation enhancement in argon driven by an all-dielectric metasurface, with a reported enhancement
  factor of up to 45 [149].”

  “observation of fifth-harmonic generation enhancement”

  “driven by an all-dielectric metasurface”'
method_summary: '“We summarise the recent advances on the generation of high-order harmonics in optical
  metaphotonic structures such as isolated resonators and metasurfaces.”

  “In this review, we summarise the rapidly developing field of metaphotonics for HHG.”'
limitations: '“Although resonant nanostructures significantly improve harmonic generation efficiencies,
  the overall conversion efficiency, particularly for higher-order harmonics, remains below that achieved
  in conventional bulk systems.”

  “Furthermore, the signature plateau-and-cutoff HHG spectra have not yet been observed from nanoresonators
  or metasurfaces.”'
