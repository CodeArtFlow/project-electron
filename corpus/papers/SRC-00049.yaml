method_summary: '“An E(3) -equivariant graph neural network trained on conventional DFT Hamiltonians of
  small structures predicts Hamiltonians for large devices, avoiding costly DFT-NEGF training data.”

  “The main DFT datasets were generated at the generalized-gradient approximation (GGA) level using the
  Perdew -Burke-Ernzerhof (PBE) exchange -correlation functional40, as implemented in the SIESTA package
  18.”

  “Additional hybrid HSE06 functional calculations were carried out using the HONPAS package46,47 to assess
  the transferability of the Hamiltonian-learning strategy beyond the PBE level.”'
limitations: “Although the H0 approximation is expected to break down in strongly nonlinear regimes such
  as those exhibiting negative differential resistance (NDR), these results establish HamGNN -NEGF as
  a reliable and computationally efficient alternative for simulating finite-bias transport in weakly
  nonlinear devices.”
