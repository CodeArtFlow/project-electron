reported: '“The maximum critical power density reached∼140 MW/cm2.”

  “A technology for the in situ formation of a three-layer TiNx/Ti/TiNx functional material within a single
  vacuum cycle is presented, together with the results of investigations of its structural and electrophysical
  properties.”

  “Upon reactivation, the resistance returned to the steady-state values; the mean relative deviation
  for the three investigated widths was 2.17% (lower panels of Figure 8).”

  “To evaluate the long-term stability of the structures without SiOx and with a protective SiOx layer,
  the current bias was selected to correspond to a power level equal to 90% of the critical value.”

  “The measurements were carried out over 24 h of continuous operation (Figure 8).”'
method_summary: '“TiNx/Ti/TiNx deposition was carried out using a Triple Target Sputter Coater DST3 equipped
  with a single two-inch titanium target.”

  “The layer thicknesses were determined by X-ray reflectometry (XRR) using a PANalytical Empyrean diffractometer.”

  “Film uniformity was evaluated from a sheet-resistance map,Rs, measured by the four-point probe method
  using a 4Dimensions 280SI system (Figure 4b).”

  “To determine the critical power and current-density values corresponding to microbridge failure, the
  current–voltage characteristics of the structures were measured. A Karl Suss PM5 probe station and a
  Rohde&Schwarz HMP4040 programmable power supply were used.”'
limitations: '“The absence of pronounced oscillations in the XRR curve limits the reliability of determining
  the thicknesses of the individual layers, since the oscillation periodandamplitudecontaininformationonthelayerthicknessesandelectron-densitycontrast.”

  “However, theR(T)calibration was performed only over the temperature range of 23–250 °C, whereas the
  maximum values in Figure 7b reach 730°C. Consequently, the high-temperature values were obtained by
  extrapolating the linear dependence and should be regarded as estimates; their accuracy may decrease
  due to nonlinearity ofR(T), annealing, changes in stoichiometry, or oxidation of the film.”'
