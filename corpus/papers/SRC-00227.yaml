method_summary: '“Evaluations on four representative LLMs demonstrate that TranSAGE achieves up to 2.41×
  higher throughput and 13.04× higher energy efficiency over commercial GPU/NPU baselines.”

  “We model the baselines using Timeloop and Accelergy [37], which support accelerator architectures and
  SRAM/-DRAM modeling.”

  “For each architecture, we perform mapping exploration using Timeloop and select the mapping that minimizes
  EDP under the same optimization criteria and search cost, reporting corresponding performance results.”

  “Since Timeloop does not support modeling multiple pipelined operations, we extract latency from our
  performance model for generated accelerators and combine it with energy estimates from Accelergy to
  obtain the final metrics.”

  “All TranSAGE configurations run at 1 GHz using a 45 nm technology model, with parameters summarized
  in Appendix B. We use DeepScaleTool [43] to scale energy estimates to 8 nm for Orin NX and 7 nm for
  A100 and Ascend 910B3.”'
limitations: '“First, its physical compute, storage, and interconnect resources are fixed after generation.”

