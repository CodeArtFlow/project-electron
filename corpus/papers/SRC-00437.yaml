  “diffractive optical processor”'
method_summary: “The diffractive network consists of multiple phase-only diffractive layers separated
  by free-space propagation distances and is optimized in silico using a scalar diffraction model.”
limitations: “First, the present study focuses on numerical design and blind testing under simulated spatially
  incoherent illumination. Experimental implementations will require further consideration of fabrication
  accuracy, alignment tolerance, material absorption, detector noise, and the stability of the optical
  system under practical satellite operating conditions.”
