reported: '“CSI-based training uses 5440 blocks (32 640 RF vectors) and reaches 91.8% test accuracy on
  8192 test blocks.”

  “CSI-based training uses 5440 blocks”

  “In simulation, uncorrected training fails in negative correlation lobes and revives in positive ones.”

  “For the isotropic spectrum (Fig. 1), uncorrected training collapses in the first negative lobe (36.2%
  at d = 0.55) and revives in the second positive lobe (89.4% at d = 1.05, matching phase correction to
  one decimal).”

  “uncorrected training collapses”'
method_summary: '“We train eight equiprobable messages over four channel uses with N t = 2 and a single
  receive antenna.”

  “The transmitter learns a 2×4 codebook per message with unit-norm columns; the receiver learns a softmax
  classifier on the 16 real features of the temporal Gram matrix of the received block.”

  “Forward and reverse noise variances are 0.10 and 0.0009 (the latter added before norm restoration);
  encoder and receiver use Adam with learning rates 0.01 and 0.03.”'
limitations: “Limitations. The rotation statement is exact for the conditional-mean port-domain return
  under our single-antenna Gaussian model; the lobe, waiting and few-bit results are simulations, not
  a convergence theorem.”
