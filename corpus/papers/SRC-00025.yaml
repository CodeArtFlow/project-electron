reported: '“AtN a = 48the hot set is about 96 GiB, fitting in HBM with headroom, yet it draws about 98%
  of read traffic while occupying 3% of KV capacity.”

  “We simulate this workload in an in-house, trace-driven simulator with analytical latency and power
  models.”

  “AtN a = 48, HBF adds 0.084 ms of overhead while NVLink-C2C adds 1.0 ms and PCIe adds 7 ms.”

  “In contrast, our design with tiering reports 14 ms per token atN a = 48 (72 tok/s) and 27 ms atN a
  = 128(37 tok/s) per agent, both safely within the 50 ms SLO.”'
