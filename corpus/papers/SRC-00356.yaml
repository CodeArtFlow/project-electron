limitations: “While the fabricated device exhibits high performance compared with incumbent airborne PMUTs,
  the analysis of the obtained measurements against the idealized simulation in Fig. 5 shows that the
  device has not yet realized its full potential. The comparison between Figs. 5 and 7 shows that the
  measured device obtained a lower k2 eff than predicted, leading to a significantly reduced ξpeak and
  ξstatic. At the same time, the device exhibited a resonance frequency approximately 3 kHz higher than
  in the simulation.”
