reported: '“The device achieves a high k2 eff of 7% alongside a C0 of 17.2 pF and a high peak out-of-plane
  displacement (ξpeak) of 19.5 µm/V at 30.4 kHz.”

  “thin-film TFE P3F LN transducer”

  “The device was simulated in vacuum using COMSOL finite-element analysis (FEA) to extract the electromechanical
  performance”

  “The resulting data revealed a well-defined resonance at 33.4 kHz with an extracted k2 eff of 3% and
  a C0 of 17 pF, in line with the simulated value from Fig. 5.”

  “The measurements were taken in air on an elevated, grounded metallic pedestal”

  “The fabricated device was measured with a Zurich MFIA impedance analyzer and a Polytec laser Doppler
  vibrometer (LDV)”

  “The LDV measurement in Fig. 8 excites the device with a 50-mV periodic chirp, confirming fundamental
  flexural-mode operation and yielding a high ξpeak of 8.5 µm/V at resonance.”

  “The LDV measurement in Fig. 8 excites the device with a 50-mV periodic chirp”

  “The measurement yields a high ξstatic of 145 nm/V, which will be used to evaluate device performance
  within the audio band.”

  “ξstatic is therefore obtained at 5 kHz”

  “Accordingly, SOC at 5 kHz is 1.4 mV/Pa, indicating a high voltage sensitivity within the flat band.”

  “Accordingly, SSC with the back-cavity effect present is found to be 12.5 fC/Pa at 5 kHz, while SOC
  is 0.78 mV/Pa at the same frequency, presenting a twofold reduction from the original measurement.”

  “LDV-measured out-of-plane displacement response of the transducer with the back-cavity effect present”'
method_summary: '“The fabricated device was measured with a Zurich MFIA impedance analyzer and a Polytec
  laser Doppler vibrometer (LDV), with the results shown in Figs. 7 and 8, respectively.”

  “The device was simulated in vacuum using COMSOL finite-element analysis (FEA) to extract the electromechanical
