reported: '“Experimental results show that PolyCIM delivers up to4× improvement in macro utilization and3.2×
  speedup, effectively bridging the gap between modern DNN operators and CIM architectures.”

  “We measure both macro utilization and execution speedup through cycle-accurate simulation.”

  “PolyCIM achieves an average speedup of 2.1× across all three models, with the primary acceleration
  stemming from optimized DWConv operations.”

  “To evaluate the end-to-end performance benefits, we also perform experiments on three complete DNN
  models with modern operators, including ConvNeXt-Tiny (CT), EfficientNet-B0 (EF), and MobileNetV2 (MN).”

  “PolyCIM achieves speedups ranging from1 .9× to8 .2×, with an average speedup of4.9×.”

  “Without affine scheduling, latency degrades by 9.7× as non-axial reuse patterns remain hidden, validating
  our core insight that these patterns are fundamental to modern operator efficiency.”

  “To quantify the contribution of each optimization component, we conduct an ablation study with the
  C1 operator by selectively disabling individual techniques.”

  “Disabling pre-tiling causes a6.2× slowdown due to uncontrolled iteration space expansion after affine
  transformation.”'
method_summary: '“We implement PolyCIM in Python using ISL for polyhedral optimization and the Gurobi
  solver for mixed-integer optimization.”

  “While PolyCIM is architecture-agnostic and can target various CIM backends, we validate our approach
  by generating domain-specific language IRs for the CIMFlow [16] framework, a CIM compilation and simulation
  infrastructure with complete instruction set architecture support.”

  “We measure both macro utilization and execution speedup through cycle-accurate simulation.”'
limitations: “The absolute utilization ceilings fall slightly on this larger macro, most visibly for C4
  which drops from 75% to 66%, likely because the additional rows are harder to fill productively once
  the operator dimensions no longer evenly divide them.”
