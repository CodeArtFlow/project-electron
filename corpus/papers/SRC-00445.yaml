method_summary: '“The electronic structures of bulk zinc-blende GaAs and diamond Si were calculated within
  density-functional theory(DFT)[33,34], usingtheall-electronfull-potential linearized augmented-plane-wave
  method implemented in WIEN2k [35].”

  “Using the calculated DFT electronic structures, we evaluated the Hall and magneto-optical responses
  within the linear-response formalism [40–43].”

  “We calculate the inverse Faraday effect using the second-order density-matrix formalism employed in
  Ref. [29].”'
limitations: '“Since phonon-assisted transitions, which govern the indirect absorption onset of Si, are
