reported: '“In both the FPEA and FBZA systems, the addition of the additive delays the emission, by 8.5
  s for FPEA and 3.5 s for FBZA.”

  “We carried out in-situ PL measurements to observe the formation of the perovskites during spin-coating,
  with and without the influence of NH4SCN.”

  “For FPEA perovskites, the rms roughness reduced with the addition of the additive, from 39 nm to 18
  nm.”

  “To examine the morphological influence of the additive, we used atomic force microscopy (AFM) to image
  the surface of each thin film, shown in Figure 2f-i.”'
method_summary: '“Thin films were fabricated via a one-step spin-coating process on quartz glass substrates
  (see Experimental Methods for more information).”

  “To measure the impact of this templated growth on perovskite photovoltaics, we fabricated p-i-n solar
  cells with a device architecture of indium tin oxide (ITO) / (2-(3,6-Dimethoxy-9H-carbazol-9-yl)ethyl)phosphonic
  acid (MeO-2PACz) / perovskite / C60 / bathocuproine (BCP) / Ag.”'
limitations: “Though detailed crystallographic information about such phases is limited due to the inability
  to synthesise high-n single crystals, we can approximate the lattice parameters by adding subsequent
  octahedral spacing distances (of ~ 8.8 Å) along the c-axis.”
