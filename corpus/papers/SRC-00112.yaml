reported: '“Across five atomic systems, Mirror maintains zero reachability violations and zero inventory
  violations, and delivers an end-to-end speed up of 103 to 104 times.”

  “We measure sensitivity over k∈ {1,2,4, . . . ,1024}micro steps on 16 held-out trajectories and compute
  the persistence ratio, defined as the fraction of backbone events surviving across horizons. Persistence
  stays above 0.98 throughout.”

  “Mirror violation 0%·F1 0.91 log-MAE 0.27·scale 1.17 ρT 0.89”

  “54-billion-atom RPV steel aging benchmark”'
method_summary: '“We propose AtomWorld-Mirror, a time-aware macro-step world model for the critical evolution
  backbone of atomic systems.”

  “For Step-Wise atomistic simulation, AtomWorld-Mirror distills short micro-event segments into physically
  reachable transitions between key states, jointly predicting sparse structural edits and accumulated
  physical time through latent macro-step dynamics.”'
limitations: '“AtomWorld-Mirror targets long-horizon materials evolution in regimes where explicit microscopic
  replay consumes most of the computational budget before structurally consequential states are reached.”

  “The current operating range reaches k= 1024 . Extending candidate-support construction and conservation
  projection to systems with larger species inventories, together with topology criteria for continuously
  evolving structures, defines the next methodological step.”'
