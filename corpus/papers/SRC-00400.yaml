reported: '“GRODE- RTL improves pass@1 over source-level exploration by 16.7% on DeepSeek, by 26.7% on
  GLM-5.2, and by 20.0% on MiniMax-M3”

  “We evaluate GRODE-RTL across 30 formally validated non-local faults using three LLMs (DeepSeek-V4-Flash,
  GLM-5.2, and MiniMax-M3) alongside a controlled five-configuration ablation study.”

  “We demonstrate Pass@1 gains of up to +26.7 pp across three LLMs (reaching a 63.3% success rate)”'
method_summary: '“Candidates are evaluated via Yosys 20-step bounded SAT equivalence checking against
  the golden RTL oracle.”

  “We evaluate 30 medium- and long-distance faults (23 designs) with source distance d (anchor declaration
  to fault site) ranging from 50 to 782 lines (median: 104.5): 18 mid-distance (50 ≤ d ≤ 150) and 12 far-distance
  (d > 150).”'
limitations: “By bounding extraction at B, GRODE-RTL targets intra-stage combinational non-locality within
  a single clock cycle, deferring multi-cycle temporal unrolling to future work.”
