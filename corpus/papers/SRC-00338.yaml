  to 22.24% on average across four GPUs.”

  “Specifically, GemAtlas reduces the MAPE from 34.04% to 23.98% for real-world LLM operators.”

  “We integrate these discovered micro-architecture details into the state-of-the-art GPU simulation framework.
  The final results demonstrate that GemAtlas reduces the mean absolute percentage error (MAPE) from 31.69%
  to 22.24% on average across four GPUs. Specifically, GemAtlas reduces the MAPE from 34.04% to 23.98%
  for real-world LLM operators.”'
method_summary: '“By developing fine-grained SASS-level benchmarking, we expose critical, previously undocumented
  micro-architectural details across different cache levels”

  “Direct SASS programming enables two key capabilities for microarchitectural characterization. First,
  explicit control of scoreboarding allows us to serialize dependent operations and measure memory latency
  with cycle-level precision. Second, fixed instruction streams ensure deterministic code footprints,
  which are critical for isolating cache behaviors.”

  “We integrate the recovered mechanisms into AccelSim [26], a widely used GPU simulator, and validate
  the model against four GPUs (H20, H100, A800, and RTX 4090) using GemAtlas-Bench”'
limitations: '“Because NVIDIA L2 indexing uses physical addresses while user programs observe only virtual
  addresses, fully recovering the indexing hash is impossible. We therefore restrict our recovery to a
  128 MiB virtual address window”

  “In contrast, the physical placement of the IMC/DCC cache cannot be directly determined due to limitations
  in the current SASS assembler tool.”'
