reported: '“For the circular-disk metasurface, the absorption exceeds 95% atD= 205nm in both simulation
  and experiment, as shown in Figure 4b, corresponding to a fill factor of 25.5%.”

  “The measured absorption of this ASI nanobar array peaks at>80%and can be spectrally tuned across a
  wide range of frequencies by modifying the spacer thickness, while simulations for the same structure
  give>95%.”

  “For the best-performing geometry in this series, the experimental peak absorption approaches80%, for
  a fill factor of 19.9%.”

  “Figure 4c–f present the simulated and measured absorption spectra of the rectangular bar configuration”

  “To provide a reference for evaluating the enhancement, we also measured a Kerr rotation of 12.5 mdeg
  from a continuous permalloy reference region on the same sample.”

  “This reference is a continuous 20 nm film deposited in the same evaporation step, on the same interference
  structure, and measured under identical conditions, so it differs from the arrays only in the absence
  of nanoscale patterning.”'
method_summary: '“The computed absorption obtained from the simplified interference model agrees closely
  with the rigorous numerical simulations.”

  “In our experiments, we study the absorption by the permalloy nanomagnet metasurface using Fourier transform
  infrared (FTIR) spectroscopy, while we study the magneto-optical interaction using longitudinal MOKE
  measurements.”'
limitations: '“Minor discrepancies are attributed to fabrication tolerances, such as edge roughness, grain
  boundaries, and slight variations in silica thickness.”

  “Gold loses its near-unity reflectivity below its interband edge near 515nm (see Supporting Information,
  Figure S3a,b), degrading the interference condition for the Au back-plane of Figure 2”

  “Near-field coupling between adjacent nanostructures is expected to be weak in the present geometry
  because of the relatively large inter-structure spacing.”

  “The analysis assumes purely p-polarized incident light, an ideal linear analyzer, and fully coherent
  specular reflection, conditions that are not strictly realized because of optical imperfections and
  alignment uncertainties.”'
