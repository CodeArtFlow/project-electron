reported: “Operating on 730 nm light, we use these devices to synthesize programmed spectra including
  a frequency shift with 50 % conversion efficiency (a 1.5×improvement over the single-tone bound)”
method_summary: '“The devices, depicted in Fig. 1a, are fabricated on 200 mm wafers in a CMOS foundry
  process at Sandia National Laboratories.”

  “We probe the electromechanical properties of these devices with a vector network analyzer (VNA) by
  extracting their microwave reflection coefficients S 11 as a function of frequency.”

  “Next, we measure the optical phase modulation produced by the two modes for this device geometry using
  the experimental setup schematically represented in Fig. 2d.”

  “To do this, we drive the device with a microwave signal at a set power and frequency and measure the
  optical power in two distinct sidebands generated by the resulting on-chip phase modulation process.
  We obtain these optical powers through heterodyne interferometric readout”'
limitations: “We also note here that the total insertion loss of one representative device is 17.7 dB.
  Since the expected propagation loss is well under 1 dB given measurements on test structures fabricated
  in the same process and with the same layer stack [14, 31, 35], this quantity is very likely dominated
  by grating coupler loss and can be significantly improved in future work.”
