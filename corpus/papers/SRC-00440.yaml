  “In FSPM, the multistage phase modulating layers are used to achieve large phase shift. However, the
  increased number of layers causes high insertion loss.”

  “Although mechanically driven THz metamaterials exhibit modulation speed on the order of kHz, their
  performance is fundamentally limited by mechanical response times and fabrication constraints, making
  them significantly slower than modulation schemes governed by intrinsic electronic dynamics”

  “However, when it is operated beyond the pull-in voltage (> ~25 V), the cantilevers get stick to the
  substrate that breaks repeatability and slows reconfigurability.”

  “the modulation speed is inherently constrained by the mechanical resonance frequency, which is typically
  in the kHz–MHz range and therefore slower than ultrafast optical or purely electronic THz modulators
  operating at GHz or higher frequencies.”'
