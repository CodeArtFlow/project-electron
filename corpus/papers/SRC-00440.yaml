reported: '“Li et al., experimentally demonstrated THz modulation in YAG: Ce over the frequency ranging
  of 0.2 to 1.8 THz, achieving 4 MHz of modulation speed and modulation depth of 83.8% under pumping laser
  power of 0.2 W/cm2.”

  “The integrated graphene-based THz modulator combined with surface emitting concentric-circular-grating
  QCL exhibited a 3dB electrical modulation bandwidth of about 110 MHz, showing a flat dependency up to
  12 MHz.”

  “Liang et al., demonstrated a monolithically integrated graphene-based modulator producing 100% THz
  modulation depth for radiation emitted from a quantum cascade laser (QCL) due to efficient THz field
  - graphene interaction.”

  “In Sb gratings on a semi-insulating GaAs substrate, Deng et al. showed a modulation speed of 1.2 GHz
  (Figure 5) (a, b).”

  “In the frequency range of 1.1-1.8 THz, a 60% modulation depth was attained.”

  “Kebin. et.al., proposed an optically controlled metamaterial modulator fabricated on a flexible polymer
  sheet that can be operated at THz frequency.”

  “The resonance frequency was observed in the region of 100-200 kHz, peaking at 137 kHz as shown in Figure
  9 (f).”

  “Raghavendra et. al., carried out dielectric measurement for a metal organic single crystal lithium
  L-ascorbate dihydrate of thickness 1.94 mm at [010] plate with silver coated surface 80.”

  “A maximal deflection of 108 pm was found at 20.7 kHz as shown in Figure 10.”

  “While a low -frequency AC field (19.2-20.9 kHz) was applied to a multilayer Z-cut LiNbO3 thin film,
  a maximal out-of-plane surface displacement at 20.7 kHz due to piezoelectric mode was observed as shown
  in Figure 11.”

  “Dutta. et al., has experimentally evidenced the THz phase modulator where a low frequency, strain driven
  piezoelectric resonance in LiNbO3 (LN) significantly controls the phase of a reflected THz beam ranging
  from 0.1- 0.5 THz.”

  “(d) Simulated surface-contour displacement plot at 21.2 kHz.”

  “Schematic of the multilayered thin film system comprising an ion-sliced single crystal z-cut LN (504
  nm thick) deposited on platinized silica grown on an LN substrate (500 μ m thick).”'
