  “We train a multilayer perceptron with a single hidden layer on MNIST.”

  “We train a multilayer perceptron with a single hidden layer on MNIST. These simulations serve three
  purposes: to verify that the two-timescale synapse preserves the learning behaviour of EqProp, to compare
  the energy-coupled form (Variant A) with the hardware-oriented decoupled form (Variant B), and to compare
  the two ways of writing the non-volatile state, phase-based and continual.”

  “With continual updates, Variant A reaches 2.24% and Variant B 2.30%, compared with 2.28% for continual
  EqProp.”'
