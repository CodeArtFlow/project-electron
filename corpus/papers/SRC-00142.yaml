limitations: “The test error with continual updates is 0.2% to 0.3% higher than with phase-based updates,
  as also observed by Ernoult et al. (2020). A likely explanation is that the learning rate must be kept
  small during the nudged phase to preserve the accuracy of the gradient estimate, which slows convergence
  and can limit the final performance.”
