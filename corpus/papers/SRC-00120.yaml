method_summary: '“Element-specific synchrotron spectroscopies are uniquely suited to understand magnetic
  properties in the light of the details of the local microscopic electronic structure.”

  “Specifically, X-ray magnetic circular dichroism (XMCD) 24–26 and resonant inelastic X-ray scattering
  (RIXS)27,28 have provided fundamental insight into related vdW magnets 29,30, and start to be increasingly
  applied to exfoliated few-layer samples31 to separate dimensionality from bulk electronic structure,
  as in NiPS3 32.”

  “X-ray absorption, XMCD, and RIXS spectra at the Fe L3,2 edges were simulated within the Anderson impurity
  model as implemented in the many-body package QUANTY 37,38.”'
limitations: '“Reaching the genuine 2D limit, however, remains challenging: flakes, produced by mechanical
  exfoliation, have limited lateral extension34—often smaller than the footprint of soft X-ray synchrotron
  beams— and relatively poor surface cleanliness.”

  “Additionally, finding small flakes across the macroscopic surface of a substrate can be practically
  challenging in the experimental setups where these techniques are implemented.”'
