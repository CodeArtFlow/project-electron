method_summary: '“In this Letter, we propose that the uniform metallic FM order is stabilized by the prominent
  quantum metric near topological band crossing points at K and K ′, which reconstructs the magnetic instability
  in the dice metal and tips the density-wave instability toward a uniform FM order.”

  “Importantly, our analysis based on random phase approximation (RPA) and Hartree–Fock theory predicts
  a remarkably high Curie temperature above room temperature for the 2D FM order.”

  “For the realistic multi-orbital model of YCl with the onsite Hubbard parameter U d2z = 0.9 eV derived
  from first-principles estimates [30], we find that χ RPAs (q, T) remains sharply peaked at q = 0 for
  all temperatures down to the critical temperature (in-set of Fig. 3(c)), and the Stoner condition yields
  a critical temperature of T RPA c ≃ 1042 K.”

  “To complement the RPA analysis with a more microscopic treatment of local magnetic moments on inequivalent
  sublattice sites, we perform self-consistent Hartree–Fock (HF) calculations based on the same ab inito-based
  Hubbard model of YCl and the same model parameters.”'
limitations: “Notably, while our RPA and HF framework neglects spatial and thermal spin fluctuations which
  may affect the exact value of Curie temperatures [44], the consistent high temperature scales obtained
  from the two independent approaches, T RPA c ≃ 1042 K and T HF c ≃ 1075 K, indicate a robust uniform
  ferromagnetic order with transition temperatures a few times of the room temperature of 300 K.”
