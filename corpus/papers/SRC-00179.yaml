reported: '“As shown in Figure 5(b)(i), the as-grown diamond exhibits an optical bandgap of approximately
  5.26 eV , slightly lower than the intrinsic bandgap reported for high -purity diamond.”

  “Figure 5. (a) Micro-Raman spectra and (b) corresponding Tauc plots obtained at successive processing
  stages: (i) as -grown diamond, (ii) after hydrogen implantation, (iii) after the first low-temperature
  annealing step, (iv) after the second high-temperature annealing step, and (v) after SCDm delamination
  and backside plasma cleaning.”

  “After removal of the bottom graphitic layer by plasma etching, a well -defined absorption edge was
  recovered, yielding an optical bandgap of approximately 5.18 e V , which is close to the as-grown value
  of 5.26 eV as shown in Figure 5(b)(v).”

  “As shown in Figure 5(a)(i), the as -grown diamond exhibits a well -defined first-order diamond peak
  centered at 1332 cm⁻¹ with a full width at half maximum (FWHM) of 9 cm⁻¹, confirming the high crystalline
  quality of the epitaxial diamond layer and providing a reference for the subsequent characterization
  stages.”

  “Micro-Raman spectroscopy was employed to monitor the structural evolution of the SCDm at each stage
  of the membrane fabrication process.”

  “After release and backside cleaning, the spectrum is dominated by the diamond Raman peak with a FWHM
  of 13 cm⁻¹, compared with 9 cm⁻¹ for the as -grown sample.”

  “More importantly, the corresponding high-density damage regions are only 32 nm for H but increase to
  43, 81, and 118 nm for He, C, and O, respectively.”

  “Figure 2. (a) Simulated depth profiles of implantation-induced vacancies in diamond with different
  implanted ions.”

  “As shown in Figure 2(b), the overall damaged-layer thicknesses are 311, 338, 468, and 607 nm for H,
  He, C, and O implantation, respectively.”'
method_summary: '“Monte Carlo simulations comparing H, He, C, and O implantation predicted a narrower
  vacancy-distribution profile for hydrogen under the implantation conditions examined .”

  “Raman spectroscopy was used to evaluate implantation -induced lattice damage and its recovery during
  annealing and membrane release, while optical bandgap analysis provided further evidence of restoration
  of the diamond lattice structure.”

  “The SCDms were subsequently transferred to GaN, SiC, AlGaN, and AlN substrates without an adhesive
  layer.”'
limitations: “However, comprehensive characterization of the electrical properties, interface quality,
