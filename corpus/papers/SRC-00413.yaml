method_summary: '“For the experimental demonstration, we used a Smartlight processor (iPronics Programmable
  Photonics, Fig. 2i), that contains a silicon-on-insulator hexagonal mesh of 72 TBUs with 28 optical
  ports along its perimeter, driven by a continuous-wave laser operating at 1550 nm (see Methods).”

  “Under the Isotropic Ring topology, routing proceeds from every input port to the spatial center of
  the mesh through a fixed path of TBUs set to the cross or bar state.”

  “For each challenge, we measured the optical power of the 27 monitored output ports at M = 168 wavelengths
  between 1550.000 and 1550.501 nm, with a step of 3 pm.”'
limitations: '“By sacrificing the entropy contribution of this small, fixed subset (8 to 12 of the 72
  TBUs; see Methods), the Isotropic Ring routes the signal through a substantially larger number of dynamic
  MZIs than the random baseline, producing a net gain in the entropy available in the response.”

  “The spectral operator, however, relies on every output port carrying enough power for its spectrum
  to be resolved above the detection noise.”'
