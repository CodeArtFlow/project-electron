reported: '“Epitaxial 40 nm thickα-Fe 2O3 thin films are grown on (0001)-oriented single-crystalline sapphire
  (Al2O3) substrates via pulsed laser deposition [Fig. 1(b)], with growth parameters detailed in our previous
  work 39.”

  “The high crystalline quality of the films is confirmed by high-resolution X-ray diffraction (see supplementary
  material (SM)).”

  “To reduce the influence of large-scale magnetic inhomogeneity and enable the characterization of individual
  magnetic structures, the films are patterned into microdisks with a diameter of 3µm [Fig. 1(c)].”

  “SEM image of a representativeα-Fe 2O3 microdisk (scale bar: 1µm).”

  “For coherent magnon excitation, a 3µm wide Ti(3 nm)/Au(80 nm) stripline antenna is deposited adjacent
  to the microdisk, with an edge-to-edge separation of 0.5µm, and connected to a vector network analyzer
  (VNA).”

  “As shown in Fig. 2(c), the measured linewidth remains of the same order over most of the investigated
  field range, with an average value of approximately 2.5 GHz, corresponding to αeff ≈4.5×10 −5.”

  “Thermal magnon spectra of a representativeα-Fe2O3 microdisk (disk 1) measured at various in-plane magnetic
  fieldsH ext.”

  “To assess whether the observed hardening can arise from microwave-induced heating, finite-element simulations
  are performed and indicate a local temperature rise of only∼5 K at the highest microwave power (see
  SM).”

  “microwave power ranging from 4 to 128 mW.”

  “finite-element simulations are performed and indicate a local temperature rise of only∼5 K at the highest
  microwave power (see SM).”'
method_summary: '“We use micro-focused Brillouin light scattering (BLS) to investigate the thermal and
  coherent magnon spectra of individual disks.”

  “The microwave current injected into the stripline generates a dynamic magnetic fieldh rf, driving the
  coherent precession of the hematite spins.”'
limitations: “We note that the measured BLS linewidth also contains unresolved extrinsic broadening contributions
  such as finite wavevector acceptance, instrumental resolution, and residual magnetic inhomogeneities.
  Therefore, the extracted value should be regarded as an upper estimate of the effective damping parameter.”
