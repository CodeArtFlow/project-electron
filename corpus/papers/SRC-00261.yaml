reported: '“Cross-sectional SEM demonstrates an average film thickness of ~100.6 nm, as shown in Fig.
  1(c).”

  “deposited on a transparent conductive oxide FTO substrate”

  “This reversal occurs beyond a coercive voltage, ~ 0.31 V on the negative side and ~1.07 V on the positive
  side, while the phase contrast is ~180°, clearly suggesting polarization switching and thus the ferroelectric
  character of our GFO thin films.”

  “PFM phase and amplitude responses were simultaneously recorded”

  “The electrical conductivity is approximately 2.38 × 10−4Ω−1𝑚−1 at 100 Hz, suggesting limited charge
  transport.”

  “The frequency -dependent conductivity in Fig. 4(b) and the impedance spectra in its inset provide further
  insight into charge transport.”

  “Remarkably, an MD coefficient of 2.3% is obtained at a low magnetic field of only 1 kOe, representing
  a significant enhancement over previously reported values for other GFO morphologies.”

  “and a strong magnetodielectric response of approximately 2.3% at 100 kHz under a 0.1 kOe magnetic field.”

  “under a 0.1 kOe magnetic field”

  “The dielectric constant is measured under magnetic fields ranging from 0 to 1 kOe, and the field-dependent
  MD factor is evaluated at 100 kHz [Fig. 5(b)].”'
method_summary: '“Using the pulsed laser deposition (PLD) approach in oxygen atmospheres with the KrF
  excimer laser (248 nm), GFO thin films are deposited on fluorine-doped tin oxide-coated glass (FTO)
  substrates at 600 ºC.”

  “The room temperature XRD data”

  “Field emission scanning electron microscope (FESEM) and energy-dispersive X-ray (EDAX) spectra are
  studied using FEI QUANTA FEG-250 with the attachment of AMETEK EDAX QUANTA 200.”

  “X-ray photoelectron spectroscopy (XPS) measurements are performed using a ULV AC-PHI 5000 Versa Probe
  III system under ultra -high vacuum conditions (5 × 10−10 mbar).”

  “Frequency-dependent dielectric measurements are performed using an LCR meter (NF Corporation ZM2376)
  for a frequency range of 1 kHz–1 MHz at room temperature.”

  “The AFM and PFM measurements are performed on a commercial MFP-3D 5 Asylum Research and Oxford Instruments
  Company AFM system (Asylum Research, Santa Barbara, CA, USA) using Dual AC Resonance Tracking (DART)
  PFM mode.”'
limitations: “Their high apparent permittivity and relatively low conductivity are promising for practical
  applications, although further optimization is needed to reduce dielectric loss and energy dissipation.”
