method_summary: “Light from a continuous-wave tunable IR laser (Toptica) is coupled into the suspended
  diamond nanobeam using an etched optical fibre taper aligned with the inverse taper of the diamond device.
  Reflection from the cavity is collected through the same fibre and directed to a photodetector through
  a beam-splitter. A 532 nm laser beam (Cobolt) was delivered from free space through a microscope objective
  with a numerical aperture of 0.5 (Mitutoyo) and focused onto the tested device.”
