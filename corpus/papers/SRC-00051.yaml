reported: '“With 10 mW of 20 kHz-modulated green light, we achieve an infrared modulation depth of approximately
  45% of the available reflection contrast.”

  “Under 532 nm illumination, the infrared (1000 to 1100 nm) cavity response is governed by two competing
  contributions”

  “Green illumination also produces quasi-permanent photo-refractive resonance blue-shifts, with a maximum
  observed tuning of 3.15 nm (0.87 THz), without measurable degradation of the cavity linewidth or contrast.”

  “The maximum blue shift relative to the initial resonance reaches ∆λ max =−3.15 nm after approximately
  5 h of cumulative green illumination distributed over four days.”

  “The devices were fabricated in single-crystal diamond with a manufacturer-specified NV concentration
  of 4 ppm (Element Six) [38].”

  “Across 22 measured devices, the mean finesse was F= 12.2±3.6 and the mean linewidth ∆ν= 121±58 GHz.”

  “For a typical 20µm cavity measured under circular green-beam excitation, the magnitude of the resonance
  shift corresponds to a mode-averaged temperature increase of approximately 0.11 K for 1.09 mW of incident
  green power at the sample plane.”

