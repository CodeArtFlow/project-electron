method_summary: “Here we show that the dynamical matrix of a message-passing potential can be obtained
  exactly in the primitive cell, at any wave vector, as the linear response of the forces to a displacement
  modulated by a Bloch phase, in the spirit of density-functional perturbation theory.”
limitations: “If, on the other hand, the dynamical matrix is calculated directly at many wave vectors,
  the cost is proportional to their number, and a dense mesh is expensive.”
