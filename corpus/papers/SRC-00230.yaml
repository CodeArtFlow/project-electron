reported: '“Synthesized in 45 nm at 100 MHz, the 784-lane INT8 core occupies 0.008701 mm2 and completes
  an inner product in 88 cycles.”

  “Evaluation on two MNIST multilayer perceptrons demonstrates arithmetic-workload speedups of 240.44×
  and 180.47× over a matched reused-MSDF implementation, reducing arithmetic energy by 98.89% and 98.58%,
  respectively.”

  “Assuming immediate weight availability, it delivers a projected throughput of 24.33 GOPS and an estimated
  energy efficiency of 1,581.14 GOPS/W at unchanged mapped power.”

  “A synthesized 16-engine accelerator occupies 0.90273 mm 2 and meets the 100 MHz timing constraint.”

  “A separate 256-engine RTL implementation completes Model A in 259 cycles, demonstrating output-parallel
  scalability.”'
