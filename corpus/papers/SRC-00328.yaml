method_summary: '“To construct the optimization problem, we generate synthetic multilayer Moir´e configurations
  by stacking six hexagonal mesh layers with independently controlled rotational angles.”

  “The final dataset consists of 600,000 unique six-layer rotational configurations, forming a large discrete
  design space with high combinatorial complexity.”

  “In this work, BO is driven by theqLog Expected Improvement (qLogEI) acquisition function, a batch variant
  of the Expected Improvement (EI) criterion, with 10 points sampled per iteration.”

  “Among the models already implemented in FruBO, we evaluated CatBoost [24]. Since CatBoost does not
  inherently estimate predictive uncertainty, uncertainty was approximated using a query-by-committee
  strategy comprising five independently trained CatBoost models initialized with different random seeds.”'
