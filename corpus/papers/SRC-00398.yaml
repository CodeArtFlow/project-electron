reported: '“larger experience banks provide better-matched latent states, improving task success by up
  to 12.24%p over conventional inference.”

  “Evaluations across VLA and WAM workloads demonstrate up to 12.24%p and 7.43%p improvements in task
  success under dense and compute-efficient configurations, respectively.”

  “FlashX interleaves three CIF engines per plane to sustain pSLC sensing throughput, reaching 5.46 GB/s
  (3.00× over Lincoln-TLC).”

  “using identical FP16 CIF engines at 200 MHz”

  “RTL simulation shows that processing a 16-KB page takes 6,167 cycles (30.8 µs), fitting within TLC
  sensing (36 µs) but exceeding pSLC sensing (12 µs) by 2.6×.”

  “Overall, FlashX adds 0.264 mm2 of logic and ECC per die, occupying only 0.75% of a 35 mm2 NAND die.”

  “The design is verified against a software golden model and synthesized using Nangate45 [23] at 200
  MHz.”

  “Consequently, FlashX achieves 1.29–3.95× end-to-end speedup over SSD-based warm-starting, enabling
  computational savings to translate into actual inference acceleration.”

  “We model TLC/pSLC sensing, page-buffer occupancy, and interleaved CIF execution using RTL-measured
  processing cycles.”

  “FlashX further improves energy efficiency by 1.12–2.34× by eliminating external key traffic and reducing
  system static energy during retrieval.”'
