reported: '“On DeepSeek-V4-Pro, weights (105.5 GB/GPU) crowd out KV capacity in the 128 GB baseline”

  “delivering 1.57× the throughput at 0.58× the energy per token (41.4 vs. 39.9 ms TBT) while saving 8.44
  PB (82%) of cluster HBM.”

  “OBM (DP-attn. + EP) stores no weights locally”'
method_summary: '“We model a datacenter cluster of 80, 000 H100-compute-class accelerators organized into
  10, 000 8-accelerator HGX-style chassis (N = 8, grouped into 400 pods of 25 chassis).”

  “We simulated this policy over 2,000 decode steps (two seeds), with every context growing by one token
  per step and finished requests replaced by new ones.”'
limitations: “Under split-port EP, the same skew would send about 1,540 of the chassis’s 1,928 tokens
  to one expert, far above b∗ = 263, so the accelerator holding it would miss weights. The solution is
  for the OBM weights server to dynamically replicate hot experts across all ports. We have not studied
  this as it is an on-line optimization and we leave it for future work.”
