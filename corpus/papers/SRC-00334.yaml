method_summary: '“Evaluated on 20 real-world RTL designs, Dr. RTL achieves average WNS/TNS improvements
  of 21%/17% with a 6% area reduction over commercial synthesis.”

  “We present Dr. RTL, a multi-agent framework that combines fine-grained timing analysis, parallel RTL
  exploration, sequential equivalence checking, and group-relative skill learning.”

  “Across eight designs, commercial synthesis tuning improves average WNS/TNS by 7.4%/11.1%, while open-source
  algorithm discovery reduces area-delay product (ADP) by 18.7%.”

  “We use Synopsys Design Compiler for commercial synthesis, the Nangate 45 nm standard-cell library [29],
  and Cadence JasperGold SEC [ 30] for verification.”'
limitations: “Power is excluded from the current optimization objective because reliable power estimation
