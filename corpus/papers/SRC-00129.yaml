reported: '“The mean W-column phase increases by approximately 13.2% from the monolayer to the bilayer
  region, compared with only 4.7% from the bilayer to the trilayer region, revealing a nonlinear thickness
  dependence.”

  “twisted trilayer WS₂ thickness staircase”

  “This corresponds to an increase of about 12.5% from monolayer to bilayer, but only about 4.4% from
  bilayer to trilayer.”

  “We constructed a ttWS₂ simulation model to simulate the observed phase responses.”

  “Simulated thickness- and overlap-dependent phase responses”'
method_summary: '“All in-focus 4D-STEM datasets of t tWS₂ used in this work were acquired on a Thermo
  Fisher Themis Z microscope equipped with an EMPAD detector at an accelerating voltage of 60 kV.”

  “The iterative ptychographic reconstruction was then performed using the LSQML engine.”

  “4D-STEM simulations were performed on a ttWS₂ model using the abTEM package to test the origin of the
  experimentally observed thickness - and overlap -dependent phase variations.”'
limitations: '“The single-slice reconstruction provides high -resolution phase contrast but exhibits local
  anomalies , including contrast reversal , in the thicker parts of the specimen.”

  “Owing to microscope instabilities during acquisition, the ADF images generated from the 4D -STEM datasets
  show noticeable affine distortions.”'
