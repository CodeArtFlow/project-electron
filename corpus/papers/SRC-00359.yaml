reported: '“For the tested device structures, the charge neutrality constraint suppresses long-wavelength
  charge bias that would otherwise distort the electrostatic potential by 0.68–1.88 eV near the device
  center”

  “and the residual compensation model corrects the remaining 0.16–0.46 eV potential mismatch in the central
  region, essential for producing the correct potential barrier profile.”

  “As shown, for a structure with 10648 atoms, DeltaChargeNet requires 4160 seconds inference time for
  a single prediction.”

  “for a structure with 10648 atoms”

  “All inference measurements are performed on an NVIDIA RTX 3090 Ti GPU (24 GB)”

  “The benchmark is carried out on a set of Hg0.5Cd0.5Te cubic supercells ranging from 512 to 10648 atoms.”'
method_summary: “We present a machine-learning (ML) charge density model, DeltaChargeNet, and its integration
  with the full-potential tight-binding muffin-tin orbital (FP-TB-MTO) method for electronic structure
  and quantum transport simulations of materials and devices.”
limitations: '“We attribute this residual error to the short channel length of Hg1−xCdxTe in the device
