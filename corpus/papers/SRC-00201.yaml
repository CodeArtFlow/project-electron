method_summary: '“We port PyTorch’s CPU FlashAttention kernel to a RISC-V CPU with 2KB vector registers”

  “We propose two techniques. The first transposes the two matrices the kernel builds, the tile of scores
  and the running output, so that queries lie along the contiguous axis.”

  “The second moves the polynomial’s coefficients into scalar registers, which stops the spilling and
  cuts the softmax region’s vector memory instructions by 78.7%.”'
limitations: '“None of this is a comparison against a GPU or a short-vector CPU, and none is needed for
  the claim, which is conditional: given a long-vector machine and a query block longer than the head
  dimension, the orientation in which the recurrence is evaluated decides the vector length of every region”

  “It concerns prefill and training, where B q can be set to VLMAX, and not autoregressive decode, where
  a query block holds one row or one query group and the natural orientation is the right one.”'
