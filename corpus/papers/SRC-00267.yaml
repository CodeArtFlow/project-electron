method_summary: '“All electrical measurements use the TT model corner at 27 ◦C.”

  “For the SAR ADC, we use deterministic transient simulations with a 40 MHz clock and a 117.1875 kHz
  differential sinusoidal input. A 1024-point coherent FFT of the reconstructed output provides SNDR,
  ENOB, and SFDR.”

  “For the LDO, we use a 10 pF output capacitor and a 1–100–1 mA load pulse with 1 µs rise and fall times.”

  “To assess main-loop stability, we measure phase margin (PM) using Spectre STB with a probe between
  VOUT and feedback resistor R7 and report the smaller value at 1 and 100 mA.”

  “PSRR at 1 MHz, measured at a static load of 100 mA, quantifies supply ripple rejection.”'
