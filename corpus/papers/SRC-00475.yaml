reported: '“At Eex = 2.33 eV, the C2,1 phonons exhibit a large DoCP of 0.70, whereas the G phonons show
  a much smaller value of −0.17 (Fig. 2d).”

  “The HRRS spectra for t(2+2)LG and t(2+1)LG (θ = 12.5◦) are presented in Fig. 2c.”

  “For example, in t(2+1)LG-CW (θ = 12.5◦), the σ+σ− intensity of the C2,1 phonon at 2.28 eV is about
  30 times larger than that at 2.41 eV.”

  “As twist angle increases from 11.0◦ to 13.2◦, the DoCP of the C2,1 phonons changes from −0.90 to 0.54.”

  “To test this expectation, we prepared t(2+1)LG-CW samples with θ = 11.0◦, 12.0◦, and 13.2◦, and measured
  the corresponding DoCP at Eex = 2.47 eV (Fig. 5a).”'
method_summary: '“In HRRS experiments (see Fig. 2b and Methods for details), the circular polarization
  states of the incident and scattered light corresponding to photons with lpht = ±1 are denoted as σ+
  and σ−, respectively.”

  “First-principles, layer-resolved amplitude maps of circular atomic motions for the G phonons in (e3)
  t(2+2)LG (θ = 13.2◦) and (e4) t(2+1)LG (θ = 13.2◦).”

  “Under these conditions, the calculated DoCP of the C2,1 phonon as a function of gate voltage agrees
  well with the experimental trend.”'
limitations: “Although the experimental and calculated cases differ in absolute twist angle and excitation
