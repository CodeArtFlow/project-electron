reported: '“a high -capacity on-chip WDM communication fabric (2.4-Tbps single-link WDM transmission and
  O-to-C-band multi-subband (de)triplexing)”

  “Furthermore, each 60-Gbaud PAM4 signal transmission channel maintains a bit error rate (BER) below
  the 20% soft-decision FEC (SD-FEC) threshold at a ROP of -2 dBm”

  “The system achieves total data rates of 1.44 Tbps and 2.4 Tbps in an intensity modulation and direct
  detection link.”

  “An integrated microheater enables dynamic modulation, achieving 16.7 nm (tuning efficiency = 0.07 nm/mW)
  of continuous wavelength tuning and intensity modulation of a single resonance with over 20 dB drop-port
  power reduction, as shown in Figs. 2h and 2i.”

  “An integrated microheater enables dynamic modulation, achieving 16.7 nm (tuning efficiency = 0.07 nm/mW)
  of continuous wavelength tuning”

  “Expanding on this, we integrat e WDM within each service band to create a 9 -channel ultra-broadband
  WDM DETRX with a total O-to-C band coverage exceeding 300 nm.”'
method_summary: '“High-resolution patterning is achieved using 100 kV electron-beam lithography (EBL)
  and subsequent development. The pattern is then transferred into the silicon device layer by inductively
  coupled plasma reactive ion etching (ICP-RIE) (Oxford PlasmaPro 100 Cobra), with an etch depth of 150
  nm.”

  “Using the measured 3 -dB (approximately 36 GHz) and 6-dB (approximately 60 GHz) bandwidths of the DEMUX
  channel, we have successfully demonstrated parallel transmission of 36-Gbaud PAM4 signals.”

  “Each output channel is detected by a high -speed photodetector (O -E conversion) and recorded by a
  real-time high-speed oscilloscope.”'
limitations: '“The performance degradation observed at shorter wavelengths is primarily attributed to
  the deviation from the central wavelength of the grating coupler and the semiconductor optical amplifier
  ’s gain spectrum , as verified in subsequent back -to-back (BtB) tests without DEMUX.”

  “Owing to variations in coupling-grating bandwidths and fabrication inconsistencies, the spectral intensities
  across channels were non-uniform.”'
