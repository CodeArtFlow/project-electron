method_summary: “Modelling the ferromagnet as an exchange-coupled macrospin within a non-equilibrium Green’s
  function framework, we find that the x-ribbon geometry of the 1Td-WTe2 phase generates a significantly
  larger current-induced spin polarization than the 1T′ phase, resulting in a larger damping-like torque
  on the adjacent magnetic layer and faster switching.”
limitations: '“However, we need to note that these Hamiltonians are only valid for small biases.”

  “Note that our analysis uses the small-bias approximation, and hence cannot accurately predict the behaviour
  at large bias voltage.”

  “These estimates are order-of-magnitude only due to the qualitative nature of this study and lie within
  the small-bias regime.”

  “Our results rely on several simplifications that future work should relax. The FM is modelled as an
  insulating macrospin coupled only through exchange, neglecting any current passing through it. Since
  the edge-dominated torque depends on a clean bulk gap, edge disorder, thermal broadening and larger
  device sizes should be examined before the width robustness of 1Td devices can be generalized.”'
