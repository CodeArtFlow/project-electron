reported: '“We develop compact potentials for Al2O3, yttria-stabilised zirconia (YSZ) and MIL-120(Al)
  us- ing 140, 195 and 494 target DFT reference configurations, respectively (Supplementary Tables 1–3).”

  “Compared with directly fine-tuned students, DICE-distilled students reduce independent-test force-component
  RMSE by 47.6%, 21.9% and 18.8% for Al2O3, YSZ and MIL-120(Al), respectively”

  “On matched α-Al2O3 displacement configurations, the DICE-distilled student reduces the mean absolute
  phonon-frequency error against DFT by approximately 79% relative to the directly fine-tuned student
  (Fig. 5c).”'
method_summary: '“Our representation-based support-assessment algorithm routes high-support configurations
  to teacher labelling to expand the student training set, while selected low-support configurations undergo
  DFT calculations to expand the teacher training set and update the teacher.”

  “OMat24-pretrained DPA4-Neo and DPA4C-Nano provide the starting points for teacher and student fine-tuning,
  respectively 23–25.”

  “Teachers and students are fine-tuned from OMat24-pretrained DPA4-Neo and DPA4C-Nano, respectively 23–25,
  using DeePMD-kit 42 with a 6 Å cutoff.”

  “First-principles calculations are performed using the Vienna Ab initio Simulation Package (VASP) 44,
  with electron–ion interactions treated using the projector augmented-wave (PAW) method 45,46.”'
limitations: “Support-guided routing depends on the teacher representations’ ability to distinguish relevant
  chemical environments and on the reference data used for comparison.”
