limitations: '“FeNOR shares the bus’s 153.6 GB/s instead of adding a link as HBF does, and in return it
  provides writable capacity, sub-picojoule access, and unmodified SoC hardware.”

  “Because 3-bit MLC threshold drift accelerates with temperature, placing the FeNOR stack atop an 85◦C
  SoC in a conventional package-on-package (PoP) layout degrades state retention.”'
