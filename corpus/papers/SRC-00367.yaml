  doping exhibit much higher transition temperatures for the formation of charge and orbital ordered phases
  of Tc = 320 K and Tc up to 370 K, respectively, compared to the half doped non-layered system Pr1−xCaxMnO3
  (PCMO) with Tc = 240 K.”

