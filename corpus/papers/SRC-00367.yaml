limitations: “By comparing Pr0.5Ca1.5MnO4 and PrCa2Mn2O7 thin films fabricated under similar conditions,
  we expect that the formation of higher order Ruddlesden-Popper type of stacking faults and point defects
  are the main cause of the reduction of the ordering temperature in PrCa2Mn2O7.”
