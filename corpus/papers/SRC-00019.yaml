reported: 'Abstract: dual-narrowband thermal emitter, aperiodic Si/SiO2 dielectric multilayer on a TiN
  refractory conductive ceramic film, optimized by multi-objective inverse design. "the fabricated sample
  exhibits two selective emission peaks at 3.26 and 6.30 μm, matching the characteristic absorption bands
  of CH4 and NO2, respectively." "the emitter maintains its dual-narrowband spectral response after heating
  to 693 K." "the dual-narrowband emitter achieved 12.2- and 13.5-fold improvements in relative sensitivity
  for CH4 and NO2 detection, respectively, compared with a conventional broadband blackbody source."
  Design: "After 100 iterations of the MOPSO optimization loop, the particle swarm converged to the final
  optimized structure... The calculated emission peaks are located at 3.26 and 6.30 μm, matching the
  selected CH4 and NO2 sensing windows, respectively." Fabrication: "The initial stage utilized ion beam
  sputtering (IBS) to deposit a 100 nm thick layer of TiN... the dielectric multilayer stack... was deposited
  via electron beam deposition (EBD)." "The fabrication process produced a 10-cm-diameter (4-inch) sample."
  Validation: "the experimental spectrum agrees closely with both the TMM design and the FDTD simulation."
  "Figure 5j,k show that the structure maintains the dual-narrowband thermal radiation peaks at 3.26 and
  6.30 μm during heating from 473 to 693 K." Experimental Procedures: "The sample was placed on a temperature
  controlled hot plate and heated at 60°C/min. After reaching 693 K, the sample was allowed to equilibrate
  for approximately 10 min before spectral acquisition." Gas sensing: "For each target gas, a certified
  2000 ppm stock gas was used... In each run, 5, 10, 15, 20, 25, or 30 mL of stock gas was introduced
  into the 126 mL gas cell, producing nominal concentrations of 79, 158, 238, 318, 397, and 476 ppm."
  "For CH4 detection, the standard blackbody source yielded an RS of [value not readable - see read_scope],
  whereas the engineered thermal radiator achieved an outstanding RS of [value not readable], representing
  an approximate 12.2-fold enhancement." "For NO2 detection, the standard blackbody produced an RS of
  [value not readable] %/ppm, whereas the thermal radiator reached [value not readable] %/ppm, corresponding
  to a 13.5-fold improvement."'
method_summary: Closed-loop inverse design (multi-objective particle swarm optimization, MOPSO, 100
  iterations) driven by a transfer-matrix-method (TMM) solver, cross-validated by finite-difference
  time-domain (FDTD) simulation, with FTIR data from fabricated samples fed back to calibrate the optical-constant
  model. The optimized structure was physically fabricated - 100 nm TiN by ion-beam sputtering (Bühler
  Leybold Optics ARES 1110) on a polished Si wafer, then Si/SiO2 dielectric layers by electron-beam deposition
  - as a 10-cm-diameter (4-inch) wafer-scale sample. Structure confirmed by cross-sectional SEM (Carl
  Zeiss Auriga). Optical characterization by FTIR (Thermo Fisher Scientific iS50) for angle-resolved reflectance/absorption
  (10-60 degrees incidence) and emission (heated stage, up to 693 K, 60 degC/min ramp, ~10 min equilibration).
  Gas-sensing tests used a sealed 126 mL gas cell, certified 2000 ppm CH4 and NO2 stock gas diluted to
  six nominal concentrations (79-476 ppm) in separate, non-cumulative runs, comparing the fabricated emitter
  against a blackbody reference at the same temperature; CH4 and NO2 were tested separately, not as a
  mixed gas.
evidence_type: measured
evidence_type_note: The headline results (peak wavelengths as fabricated, 693 K stability, gas-sensing
  sensitivity) are experimentally measured on the physical sample. The design/optimization stage (TMM/FDTD-calculated
  peak locations, MOPSO convergence) is simulated - a genuinely mixed-evidence paper. extract-claims
  should set evidence_type per claim (simulated for the design-stage numbers, measured for the fabricated-sample
  numbers), not copy this record's single measured value onto every claim.
grade: A
limitations: Single fabricated sample (n=1); no replicate devices or error bars reported for the emission-peak
  positions, the 693 K stability result, or the sensitivity enhancement factors. CH4 and NO2 were tested
  in separate single-gas runs, not simultaneously as a real dual-species measurement would require. The
  two absolute relative-sensitivity values (%/ppm, one per gas per source) that the 12.2x/13.5x ratios
  are computed from were not readable in the copy we have (see read_scope) - only the stated ratios could
  be verified. Data availability statement reads "Data underlying the results presented in this paper
  are not publicly available at this time but may be obtained from the authors upon reasonable request"
  - no independent reproduction possible without contacting the authors. Authors declare no conflicts
  of interest.
read_scope: The full HTML article text was read as rendered by Wiley's page (retrieved by the user directly,
  since our own automated fetch of both the DOI resolver and the Wiley article page returned HTTP 403
  behind a Cloudflare bot-check) - abstract, introduction, all Results and Discussion subsections, conclusion,
  and the full Experimental Procedures. All figure and table CAPTIONS were read; the figure and table
  IMAGES themselves were not seen (access is full_text, not full_text_figures). The page's inline mathematical
  notation (rendered as MathML/equation images in the browser) did not survive the copy into plain text
  - the fitness-function weights, the normalized-sensitivity formula, the concentration formula, and critically
  the two absolute relative-sensitivity (RS) values feeding the 12.2x/13.5x ratios are NOT recorded here
  because they were never actually seen as legible numbers, only as "[mathematical equation]" placeholders
  in the source text. Do not infer them.
