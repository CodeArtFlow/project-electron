  (S), and electronic thermal conductivity (κe), are evaluated by solving the Boltzmann transport equation
  (BTE) within the Onsager transport formalism, as implemented in the AMSET code[46].”'
limitations: “We discarded the semimetallic compounds ZrHfIr2Bi2 and Hf2RhIrBi2 for further thermoelectric
  properties calculations due to the limitations of our computational methodology.”
