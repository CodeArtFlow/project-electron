method_summary: '“We performed first-principles density functional theory (DFT) calculations within the
  Vienna Ab initio Simulation Package (VASP)[35, 36] using the pseudopotentials derived from projected
  augmented wave (PAW) method[37, 38] to describe the interactions between the core and valance electrons.”

