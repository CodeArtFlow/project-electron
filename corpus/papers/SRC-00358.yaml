reported: '“The spectral shift associated with hole thermalization in the VBs occurs on a timescale of
  0.8 ± 0.2 ps, with an energy shift of ~0.4 eV (Fig. 2d).”

  “Kinetic trace of hot hole thermalization at the Re O2 edge averaged across ~44–45 eV.”

  “In our experiment, a 3.1 eV (400 nm) excitation pulse generates electron-hole pairs across the band
  gap of single crystalline Re6Se8Cl2.”

  “The oscillation period is measured to be 270 fs, which corresponds to 3.6 THz as shown in panel b.”

  “a, Kinetic profile of intensity oscillation averaged across ~45.9 – 46.3 eV, fitted with a sine function
  (dashed red line).”

  “We measure phonon oscillations in our transient XUV absorption spectra at the Re O2 edge (Fig. 2a).”'
method_summary: '“In our experiment, a 3.1 eV (400 nm) excitation pulse generates electron-hole pairs
  across the band gap of single crystalline Re6Se8Cl2.”

  “The resulting carrier dynamics are probed by a broadband XUV pulse in a 10° grazing incidence reflection
  geometry.”

  “The XUV pulse simultaneously measures the Re O2 and Se M4,5 edges, revealing the local chemical environment
  around Re and Se sites, as shown in Figures 2 and 3, respectively.”'
