reported: '“Experimental results on 4-, 8-, and 16-core PDNs demonstrate that the proposed approach reduces
  the average PDN area from 0.3170 to 0.1686, corresponding to a 47% reduction, while maintaining zero
  EM and voltage violations.”

  “Performance was compared against the original workload-aware PDNs (Baseline) and a Simulated Annealing
  (SA) optimizer using the same objective and constraint definitions.”

  “Furthermore, the proposed Deep Q-Network (DQN)-based optimizer reduces the average normalized PDN area
  by 47% while satisfying all EM and IR-drop constraints.”

  “Compared to simulated annealing, the proposed approach achieves comparable optimization quality while
  providing approximately 26×faster optimization.”'
method_summary: “Electrical and reliability metrics are obtained using SPICE-based circuit analysis and
  EM lifetime estimation.”
limitations: “While SA achieves a slightly lower average normalized area (0.1438 versus 0.1686), the difference
  in optimization quality is relatively small compared to the substantial difference in runtime.”
