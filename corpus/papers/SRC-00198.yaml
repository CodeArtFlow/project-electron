method_summary: '“The fabricated devices were characterized using a continuous-wave (CW) telecom laser
  (Toptica CTL1550, tunable from 1510 to 1630 nm) and a near -visible laser (Newport TLB6712, tunable
  from 765 to 781 nm) , as shown in Figure 3a.”

  “To evaluate the impact of the surface molecular pattern on SHG, we measured the on-chip SH power versus
  pump power for the same poling-free TFLN device with and without the surface patterned molecules.”'
limitations: '“Because their effective refractive indices differ significantly, natural phase matching
