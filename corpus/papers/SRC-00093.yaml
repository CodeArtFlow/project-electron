reported: '“The wafer thickness was approximately 340 µm, and the [0001] axis was tilted by 0.5° from
  the wafer normal toward [1̅100] by rotation about the [112̅0] axis.”

  “The commercially available 2-inch GaN (0001) wafer grown by a conventional ammonothermal method25 was
  used.”'
method_summary: '“Phase-contrast microscopy was performed using a Crystalline Tester CP1 (Ceramic Forum
  Co., Ltd., Japan) equipped with a 20× CFI Plan Fluor DLL positive -phase-contrast objective lens (NA
  = 0.5, PH1; Nikon, Japan), a ring-aperture condenser (NA = 0.78), and a 405-nm LED light source.”

  “Reflection XRT images of the ammonothermal GaN wafer were acquired using six equivalent g = 11−24 reflections
  at BL3C of the High Energy Accelerator Research Organization (KEK).”

  “The dislocation was characterized by weak-beam dark -field imaging and large-angle convergent -beam
  electron diffraction (LACBED) analysis to determine its Burgers vector26–30.”'
limitations: “When the inclination of a threading edge dislocation with respect to the optical axis becomes
  large, linear contrast arising from the inclined dislocation line is superimposed on the dipole -like
  contrast, making determination of the Burgers vector difficult.”
