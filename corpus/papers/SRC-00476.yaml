method_summary: '“Under ultrafast excitation, these currents radiate single-cycle terahertz toroidal pulses
  spanning electric- and magnetic-dominant modes with dynamically evolving skyrmion textures. Full spatiotemporal
  mapping and reconstruction provide a complete visualization of the toroidal structure of light”

  “Employing a sensitive scanning fiber-coupled photoconductive antenna, we map the THz emission as a
  function of time and lateral position for hyperspectral images of the THz field profiles (Methods),
  measured away from the focal plane for improved resolution (Fig. S2).”'
limitations: '“Although both readouts are effectively global, the local nature of the vectorial control
  around each individual nanoantenna is clarified by the diffraction-limited excitation for the photocurrent
  measurement, where only a few nanoantennas fall within the laser spot.”

  “Small dc current offsets may be attributed to relatively minor photothermoelectric current contributions
  from the gold electrodes.”'
