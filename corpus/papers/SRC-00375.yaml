reported: '“Experiments on commercial smartphones show that, in controlled comparisons with the autoregressive
  T3A+ baseline, DroidPrefill reduces per-step inference latency by up to 85.0%, while improving task
  success rate by up to 24.6%.”

  “controlled comparisons with the autoregressive T3A+ baseline”

  “DroidPrefill reduces per-step inference latency by up to 85.0%”'
method_summary: '“The complete DroidPrefill agent runtime executes on a physical Xiaomi 17 smartphone
  powered by a Qualcomm Snapdragon 8 Elite Gen 5 SoC.”

  “For model inference, we evaluate two runtime paths provided by GenieX on the smartphone NPU. The first
  uses the GenieX QAIRT runtime (QAIRT) with precompiled W4A16 bundles through the QNN HTP backend. The
  second uses the GenieX llama.cpp runtime (llama.cpp) with Q4_0 GGUF models configured for the Hexagon
  NPU.”'
limitations: '“First, fully on-device deployment currently relies on compact and quantized models with
  bounded context, which limits semantic reasoning and long-horizon planning on difficult GUI tasks.”

  “Second, DroidPrefill primarily relies on accessibility-based UI representations, which may be incomplete
  for visually rich or custom-rendered interfaces.”

  “Third, SPAD currently depends on manually calibrated confidence thresholds and action eligibility rules,
  while the bounded state ledger may still lose information in very long tasks.”

  “Finally, our evaluation focuses on Qualcomm smartphone NPUs and uses representative rather than benchmark-scale
  real-device validation.”'
