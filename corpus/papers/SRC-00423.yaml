method_summary: '“Here we introduce WannDiffuse, a universal diffusion model for the quantum position
  operator based on predicting the centres and real-space localization of MLWFs.”

  “Our framework combines E(3)-equivariant graph neural networks based on NequIP [36, 37] with a generative
  diffusion process [38–42] to predict WCCs and spreads directly from atomic configurations.”

  “DFT calculations for liquid water, amorphous Silicon and Barium titanate were performed using Quantum
  ESPRESSO [69–71] in conjunction with the SSSP Efficiency pseudopotential library (version 1.3, PBEsol
  functional) [72–78].”'
limitations: “Of these, we retained 2907 structures for which all semicore states were fully Wannierized,
