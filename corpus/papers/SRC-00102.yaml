reported: '“In Fig. 2(d), an optimal concentration window appears aroundβ= 4.17%, where the AHC atE F
  reaches 603 S cm−1, corresponding to a about 400% enhancement over pristine Mn 3Sn.”

  “Virtual crystal approximation (VCA) results for the anomalous Hall conductivity (AHC) and Berry curvature
  (BC) hotspot in Cr-doped Mn 3Sn.”

  “Quantitatively, the zero field Hall resistivity of [Mn 3Sn(2.4)/Cr(0.15)]30 increases from 3.35µΩ cm
  at 300 K to 5.56µΩ cm at 50 K.”

  “At 300 K,σ xy is already enhanced in the Cr doped samples relative to undoped MS, reaching 57.8, 52.6,
  and 41.66 Ω −1 cm−1 in [Mn3Sn(2.4)/Cr(0.15)]30, [Mn3Sn(2.4)/Cr(0.6)]30, and MS50Cr10, respectively,
  compared with 39.5 Ω−1 cm−1 in MS.”

  “in [Mn3Sn(2.4)/Cr(0.15)]30”

  “When the temperature decreases to 50 K, it reaches 184.8, 149.9, and 109.2 Ω −1 cm−1 in [Mn 3Sn(2.4)/Cr(0.15)]30,
  [Mn3Sn(2.4)/Cr(0.6)]30, and MS50Cr10, respectively, whileσ xy in MS decreases to nearly zero.”

  “in [Mn 3Sn(2.4)/Cr(0.15)]30”

  “When the temperature decreases to 50 K”'
method_summary: '“First-principles calculations were performed usingQuantum Espresso[39, 40].”

  “Cr substitution on the Mn sublattice was modeled using both the virtual crystal approximation (VCA)
  and explicit supercells.”

  “The Bloch states from the non-self-consistent field (NSCF) calculations were further transformed into
  maximally localized Wannier functions (MLWFs) using the WANNIER90 package [43].”

  “Two types of Cr doped Mn 3Sn thin films were prepared using, respectively, uniform doping and modulation
  doping strategies, together with an undoped Mn 3Sn reference.”

  “All films were deposited on SiO 2/Si substrates by room temperature magnetron sputtering with a base
  pressure of 2×10−8 Torr and a working pressure of 3×10−3 Torr, followed by post annealing at 450◦C for
  1 h in vacuum (2×10−5 Torr) to promote crystallization and dopant interdiffusion.”'
limitations: '“Consequently, the measured Hall conductivity reflects both the intrinsic Berry curvature
  contribution and the structural and transport characteristics of the polycrystalline film and cannot
  be directly compared with the calculated intrinsic value.”

  “A full treatment of configurational disorder and a quantitative separation of intrinsic and extrinsic
  Hall contributions would require disorder-aware transport calculations beyond the scope of the present
  work.”'
