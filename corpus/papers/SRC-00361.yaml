method_summary: '“Using ultrafast stroboscopic optical scattering microscopy (stroboSCAT), we image spatiotemporal
  evolution of energy carriers with picosecond resolution, simultaneously resolving heat and charge transport
  in bulk black phosphorus and exciton transport in the monolayer.”

  “To understand the experimentally measured diﬀusion, we perform ﬁrst principles calculations of the
  exciton dispersion39, exciton-phonon scattering rates40–43, and exciton transport within a Boltzmann
  transport equation approach43–45.”'
limitations: '“A similar analysis targeting the heat contrast recovers diﬀusion coeﬃcients on the order
