name: Build and deploy site

# The publication gate is the point of this workflow. Every step before `deploy` is a reason NOT
# to publish, and any of them failing stops the deployment. A gate that CI can route around is
# not a gate, so there is no continue-on-error anywhere in this file and no manual override input.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. `cancel-in-progress: false` so a queued deploy finishes rather
# than being dropped - a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Self-tests and publication gate
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # Each of these validates an authority file, not just code. A failure here means one of
      # reference/definitions.yaml, reference/schemas.yaml or sources/registry.yaml is wrong.
      - name: Registry is internally consistent
        run: python pipeline/validate_registry.py

      - name: SI engine and definitions are dimensionally consistent
        run: python pipeline/units.py

      - name: Extraction refusals fire
        run: python pipeline/claims.py --self-test

      - name: Ledger validates
        run: python pipeline/claims.py --validate

      - name: Extract path works end to end
        run: python pipeline/test_extract_e2e.py

      - name: Every publication-gate check fires
        run: python pipeline/test_publication_gate.py

      - name: Discovery loop obeys its constraints
        run: python pipeline/test_discover.py

      - name: Bounds, corrections and the digest (regression tests)
        run: python pipeline/test_bounds.py

      - name: Constants match the NIST authority file
        run: |
          python pipeline/bounds.py --verify
          python pipeline/test_authority_bounds.py

      - name: Gold set and its evaluator
        run: python pipeline/test_gold_eval.py

      - name: The reader cannot record what a paper does not say
        run: python pipeline/test_reader.py

      - name: The site builds with an audit report present
        run: python pipeline/test_build_site.py

      - name: One copy of the doctrine and of the skills (CLAUDE.md imports AGENTS.md; .agents/skills mirrors .claude/skills)
        run: python pipeline/test_agent_files.py

      - name: TypeSafe offline tests
        run: |
          python pipeline/test_assess_quality.py
          python pipeline/test_semantic_checks.py

      # Whether findings BLOCK is decided by reference/semantic_policy.yaml (a committed file, so
      # changing it is a visible commit). There is deliberately no input, env var or
      # continue-on-error here that alters it: a gate CI can route around is not a gate.
      - name: TypeSafe publication audit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python pipeline/semantic_checks.py --scope publication --live --max-calls 64 --seconds 180

      - name: Retain publication audit even when blocked
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: typesafe-publication
          path: |
            run/typesafe-publication.json
            run/typesafe-publication.md
          if-no-files-found: error

      - name: Publication gate
        env:
          ELECTRON_TYPESAFE_REQUIRED: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '1' || '0' }}
        run: python pipeline/publication_gate.py

  build:
    name: Build site
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # build_site.py runs the gate again itself and refuses to write output if it fails.
      # Belt and braces: the gate decides whether anything is publishable, not the build.
      - name: Retrieve current publication evidence
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: typesafe-publication
          path: run

      - name: Build
        env:
          ELECTRON_TYPESAFE_REQUIRED: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '1' || '0' }}
        run: python pipeline/build_site.py --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests build and are gated, but never deploy - only main publishes.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
